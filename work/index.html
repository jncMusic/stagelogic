<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>업무 흐름 | 스테이지로직</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
/* 색: 분야 = 구별용 8색(고정 순서), 상태 = 완료/막힘만 상태색 + 아이콘 + 글자 */
:root {
  color-scheme: light;
  --bg: #f4f3ef; --surface: #fcfcfb; --surface-2: #f0efea; --line: #e3e1da; --line-2: #d3d0c6;
  --fg: #0b0b0b; --fg-2: #52514e; --fg-3: #7b7a74;
  --accent: #2a78d6; --accent-soft: #e3eefb;
  --good: #0ca30c; --good-ink: #006300; --good-soft: #e3f4e3;
  --warn: #fab219; --warn-ink: #8a5a00; --warn-soft: #fdf1d6;
  --bad: #d03b3b; --bad-ink: #b02a2a; --bad-soft: #f9e3e3;
  --a1: #2a78d6; --a2: #eb6834; --a3: #1baf7a; --a4: #eda100; --a5: #e87ba4; --a6: #008300; --a7: #6250d6; --a8: #e34948; --a9: #96643c;
  --shadow: 0 1px 2px rgba(20,20,10,.06), 0 4px 14px rgba(20,20,10,.06);
  --shadow-lg: 0 12px 40px rgba(20,20,10,.18);
  --font: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #222220; --line: #2e2d2a; --line-2: #3d3c38;
  --fg: #f0efec; --fg-2: #c3c2b7; --fg-3: #8f8e86;
  --accent: #3987e5; --accent-soft: #1b2b40;
  --good-ink: #5fd35f; --good-soft: #17301a; --warn-ink: #fab219; --warn-soft: #3a2e12; --bad-ink: #f07d7d; --bad-soft: #3a1d1d;
  --a1: #3987e5; --a2: #d95926; --a3: #199e70; --a4: #c98500; --a5: #d55181; --a6: #008300; --a7: #9085e9; --a8: #e66767; --a9: #b9875e;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3); --shadow-lg: 0 12px 40px rgba(0,0,0,.55);
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #222220; --line: #2e2d2a; --line-2: #3d3c38;
  --fg: #f0efec; --fg-2: #c3c2b7; --fg-3: #8f8e86;
  --accent: #3987e5; --accent-soft: #1b2b40;
  --good-ink: #5fd35f; --good-soft: #17301a; --warn-ink: #fab219; --warn-soft: #3a2e12; --bad-ink: #f07d7d; --bad-soft: #3a1d1d;
  --a1: #3987e5; --a2: #d95926; --a3: #199e70; --a4: #c98500; --a5: #d55181; --a6: #008300; --a7: #9085e9; --a8: #e66767; --a9: #b9875e;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3); --shadow-lg: 0 12px 40px rgba(0,0,0,.55);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-variant-numeric: tabular-nums; }

/* 잠금 화면 */
.lock { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.lock-card { width: min(380px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px; box-shadow: var(--shadow); }
.lock-card h1 { margin: 0 0 4px; font-size: 1.35rem; }
.lock-card p { margin: 0 0 18px; color: var(--fg-2); }
.field { display: grid; gap: 6px; font-size: .82rem; font-weight: 600; color: var(--fg-2); }
.input { width: 100%; background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 11px; font-size: .95rem; min-width: 0; }
.input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
textarea.input { resize: vertical; min-height: 72px; line-height: 1.55; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 10px; padding: 7px 12px; font-weight: 600; font-size: .88rem; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn.primary:hover { opacity: .9; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.danger { color: var(--bad-ink); }
.btn.danger.armed { background: var(--bad-soft); border-color: transparent; }
.btn kbd { font: inherit; font-size: .72rem; opacity: .6; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; }
.msg { font-size: .85rem; color: var(--fg-2); min-height: 1.4em; }

/* 머리 */
.app { min-height: 100vh; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; gap: 14px; padding: 10px 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 8px; margin-right: auto; min-width: 0; }
.brand b { font-size: 1.05rem; letter-spacing: -.01em; }
.brand span { color: var(--fg-3); font-size: .8rem; font-weight: 600; }
.overall { display: flex; align-items: center; gap: 10px; }
.overall .pct { font-size: 1.25rem; font-weight: 800; letter-spacing: -.02em; }
.overall .bar { width: 140px; }
.overall .counts { font-size: .78rem; color: var(--fg-2); white-space: nowrap; }
.bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; display: flex; gap: 2px; }
.bar i { display: block; height: 100%; border-radius: 99px; }
.bar .d { background: var(--good); } .bar .g { background: var(--fg-3); }
.tabs-row { display: flex; align-items: center; gap: 10px; padding: 0 16px 8px; flex-wrap: wrap; }
.tabs { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.tabs button { border: 0; background: transparent; border-radius: 7px; padding: 5px 12px; font-weight: 600; font-size: .86rem; color: var(--fg-2); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.search { position: relative; margin-left: auto; }
.search input { width: 220px; padding-left: 30px; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--fg-3); }
.menu { position: relative; }
.menu-pop { position: absolute; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 6px; min-width: 200px; z-index: 50; }
.menu-pop button { display: flex; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; font-size: .88rem; gap: 8px; }
.menu-pop button:hover { background: var(--surface-2); }
.menu-pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

/* 필터 */
.filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 10px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 99px; padding: 3px 10px; font-size: .8rem; font-weight: 600; color: var(--fg-2); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--fg-3)); flex: none; }
.chip[aria-pressed="true"] .dot { box-shadow: 0 0 0 2px var(--bg); }
.filters .sep { width: 1px; height: 18px; background: var(--line-2); margin: 0 4px; }
.filters .clear { border: 0; background: none; color: var(--accent); font-size: .8rem; font-weight: 600; }

/* 요약 */
.summary { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; padding: 14px 16px 4px; }
.sum-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; text-align: left; display: grid; gap: 8px; min-width: 0; }
.sum-card[aria-pressed="true"] { border-color: var(--fg); box-shadow: 0 0 0 1px var(--fg); }
.sum-head { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: .9rem; min-width: 0; }
.sum-head span:not(.dot) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sum-head .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }
.sum-head em { margin-left: auto; font-style: normal; font-weight: 800; font-variant-numeric: tabular-nums; }
.sum-meta { font-size: .76rem; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.alerts { display: flex; gap: 8px; flex-wrap: wrap; padding: 8px 16px 0; }
.alert { display: inline-flex; gap: 6px; align-items: center; font-size: .8rem; font-weight: 600; border-radius: 8px; padding: 4px 10px; border: 1px solid transparent; background: var(--surface); }
.alert.over { background: var(--bad-soft); color: var(--bad-ink); }
.alert.soon { background: var(--warn-soft); color: var(--warn-ink); }
.alert.block { background: var(--bad-soft); color: var(--bad-ink); }
.alert.mine { border-color: var(--line-2); color: var(--fg-2); }

main { flex: 1; padding: 12px 16px 60px; min-width: 0; }

/* 상태 표시 (아이콘 + 글자) */
.st { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; font-weight: 700; border-radius: 99px; padding: 2px 8px 2px 6px; white-space: nowrap; }
.st svg { flex: none; }
.st.todo { background: var(--surface-2); color: var(--fg-2); }
.st.doing { background: var(--accent-soft); color: var(--accent); }
.st.blocked { background: var(--bad-soft); color: var(--bad-ink); }
.st.done { background: var(--good-soft); color: var(--good-ink); }

/* 카드 */
.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px 9px 13px; box-shadow: 0 1px 1px rgba(0,0,0,.03); cursor: pointer; display: grid; gap: 6px; min-width: 0; transition: box-shadow .12s, border-color .12s, opacity .12s; }
.card::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--c); }
.card:hover { border-color: var(--line-2); box-shadow: var(--shadow); }
.card.is-done { opacity: .62; }
.card.is-done .c-title { text-decoration: line-through; text-decoration-color: var(--line-2); }
.card.dragging { opacity: .35; }
.card.dim { opacity: .25; }
.card.hl { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.c-title { font-weight: 650; font-size: .88rem; line-height: 1.35; overflow-wrap: anywhere; }
.c-meta { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: .72rem; color: var(--fg-2); }
.who { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; }
.who i { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: .62rem; font-weight: 800; background: var(--surface-2); color: var(--fg-2); border: 1px solid var(--line-2); }
.who.claude i { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.tag { display: inline-flex; align-items: center; gap: 3px; border-radius: 6px; padding: 0 6px; font-weight: 700; font-variant-numeric: tabular-nums; background: var(--surface-2); }
.tag.over { background: var(--bad-soft); color: var(--bad-ink); }
.tag.soon { background: var(--warn-soft); color: var(--warn-ink); }
.c-detail { font-size: .78rem; color: var(--fg-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.c-note { font-size: .76rem; background: var(--surface-2); border-radius: 6px; padding: 4px 7px; color: var(--fg-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* 흐름: 분야(가로줄) × 단계(세로줄) */
.flow-wrap { position: relative; overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface-2); }
.flow { position: relative; display: grid; grid-template-columns: 170px repeat(4, minmax(210px, 1fr)); min-width: 1010px; }
.flow .hcell { position: sticky; top: 0; z-index: 3; background: var(--surface-2); padding: 10px 12px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: .82rem; display: flex; align-items: center; gap: 8px; }
.flow .hcell em { font-style: normal; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.lane-h { position: sticky; left: 0; z-index: 2; background: var(--surface-2); border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 12px; display: grid; align-content: start; gap: 8px; }
.lane-h b { display: flex; align-items: center; gap: 8px; font-size: .88rem; }
.lane-h b i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }
.lane-h .sum-meta { font-size: .72rem; }
.cell { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 64px; transition: background .1s; }
.cell:last-child { border-right: 0; }
.cell.over { background: var(--accent-soft); }
.cell .add-here { border: 1px dashed var(--line-2); background: transparent; border-radius: 8px; color: var(--fg-3); font-size: .76rem; padding: 4px; opacity: 0; transition: opacity .1s; }
.cell:hover .add-here, .col:hover .add-here { opacity: 1; }
.links { position: absolute; inset: 0; pointer-events: none; z-index: 1; overflow: visible; }
.links path.lk { fill: none; stroke: var(--fg-3); stroke-width: 1.5; }
.links path.lk.wait { stroke-dasharray: 5 4; }
.links path.lk.hl { stroke: var(--accent); stroke-width: 2.25; }
.flow .card { z-index: 2; }

/* 보드 */
.board { display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.col { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 200px; }
.col.over { background: var(--accent-soft); }
.col-h { display: flex; align-items: center; gap: 8px; padding: 2px 4px 6px; font-weight: 700; }
.col-h em { font-style: normal; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.drop-mark { height: 3px; background: var(--accent); border-radius: 3px; margin: -2px 0; }

/* 일정 */
.tl-tools { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.tl-wrap { display: grid; grid-template-columns: 1fr 260px; gap: 12px; align-items: start; }
@media (max-width: 960px) { .tl-wrap { grid-template-columns: 1fr; } }
.tl { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); position: relative; }
.tl-grid { position: relative; }
.tl-head { position: sticky; top: 0; z-index: 3; height: 44px; background: var(--surface); border-bottom: 1px solid var(--line); }
.tl-head span { position: absolute; top: 6px; font-size: .72rem; color: var(--fg-3); font-variant-numeric: tabular-nums; white-space: nowrap; transform: translateX(4px); }
.tl-head span.m { top: 22px; font-weight: 700; color: var(--fg-2); }
.tl-lane { position: relative; border-bottom: 1px solid var(--line); }
.tl-lane-name { position: sticky; left: 0; z-index: 2; display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 700; padding: 6px 10px; background: var(--surface); border-radius: 0 0 8px 0; }
.tl-lane-name i { width: 9px; height: 9px; border-radius: 3px; background: var(--c); }
.tl-row { position: relative; height: 34px; }
.tl-bar { position: absolute; top: 5px; height: 24px; border-radius: 7px; background: color-mix(in srgb, var(--c) 22%, var(--surface)); border: 1.5px solid var(--c); display: flex; align-items: center; padding: 0 8px; font-size: .76rem; font-weight: 650; white-space: nowrap; cursor: grab; user-select: none; touch-action: none; min-width: 8px; }
.tl-bar span { overflow: visible; }
.tl-bar.done { opacity: .55; }
.tl-bar.blocked { border-style: dashed; }
.tl-bar .grip { position: absolute; right: -2px; top: 0; bottom: 0; width: 10px; cursor: ew-resize; }
.tl-ms { position: absolute; top: 9px; width: 16px; height: 16px; transform: translateX(-8px) rotate(45deg); background: var(--c); border-radius: 3px; cursor: grab; touch-action: none; }
.tl-ms + .tl-lbl { position: absolute; top: 7px; font-size: .76rem; font-weight: 650; white-space: nowrap; pointer-events: none; }
.tl-week { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
.tl-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); z-index: 2; }
.tl-today::after { content: "오늘"; position: absolute; top: 2px; left: 4px; font-size: .68rem; font-weight: 800; color: var(--accent); }
.undated { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 6px; max-height: 70vh; overflow: auto; }
.undated h3 { margin: 0 0 4px; font-size: .85rem; }
.undated button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px; font-size: .8rem; display: flex; gap: 6px; align-items: center; }
.undated button i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); flex: none; }

/* 목록 */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 860px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); font-size: .84rem; vertical-align: middle; }
th { font-size: .76rem; color: var(--fg-2); font-weight: 700; background: var(--surface-2); position: sticky; top: 0; }
th button { border: 0; background: none; padding: 0; font-weight: 700; color: inherit; }
th button[data-dir]::after { content: attr(data-dir); margin-left: 4px; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--surface-2); }
td.t { font-weight: 650; }
td .area { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
td .area i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
select.st-sel { border: 0; border-radius: 99px; padding: 2px 8px; font-size: .76rem; font-weight: 700; appearance: none; }

/* 빈 화면 */
.empty { border: 1px dashed var(--line-2); border-radius: 14px; padding: 36px; text-align: center; color: var(--fg-2); background: var(--surface); }

/* 상세 서랍 */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.25); z-index: 60; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: var(--surface); z-index: 61; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; animation: slide .16s ease-out; }
@keyframes slide { from { transform: translateX(24px); opacity: .6; } }
@media (prefers-reduced-motion: reduce) { .drawer { animation: none; } }
.d-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.d-head .area-pill { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 700; color: var(--fg-2); }
.d-head .area-pill i { width: 9px; height: 9px; border-radius: 3px; background: var(--c); }
.d-body { flex: 1; overflow: auto; padding: 16px; display: grid; gap: 14px; align-content: start; }
.d-title { font-size: 1.2rem; font-weight: 750; border: 1px solid transparent; border-radius: 8px; padding: 4px 6px; margin: -4px -6px; width: calc(100% + 12px); background: transparent; letter-spacing: -.01em; }
.d-title:hover { border-color: var(--line); }
.d-title:focus { border-color: var(--accent); outline: none; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--surface-2); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: transparent; border-radius: 8px; padding: 6px 4px; font-size: .8rem; font-weight: 700; color: var(--fg-2); display: inline-flex; gap: 5px; align-items: center; justify-content: center; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.deps { display: flex; flex-wrap: wrap; gap: 6px; }
.dep { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); border-radius: 8px; padding: 3px 4px 3px 8px; font-size: .8rem; background: var(--surface); max-width: 100%; }
.dep b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dep button { border: 0; background: none; color: var(--fg-3); padding: 0 4px; font-size: 1rem; line-height: 1; }
.dep.after { border-style: dashed; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.log li { font-size: .78rem; color: var(--fg-2); display: grid; grid-template-columns: auto 1fr; gap: 8px; }
.log time { color: var(--fg-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.d-foot { border-top: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 8px; align-items: center; }
.saving { font-size: .76rem; color: var(--fg-3); margin-left: auto; }
.sec-t { font-size: .76rem; font-weight: 700; color: var(--fg-2); margin: 0 0 6px; }

/* 대화상자 */
dialog { border: 0; border-radius: 16px; padding: 0; background: var(--surface); color: var(--fg); box-shadow: var(--shadow-lg); width: min(520px, calc(100% - 32px)); }
dialog::backdrop { background: rgba(0,0,0,.3); }
.dlg { padding: 20px; display: grid; gap: 12px; }
.dlg h2 { margin: 0; font-size: 1.1rem; }
.dlg-foot { display: flex; justify-content: flex-end; gap: 8px; align-items: center; }
.area-rows { display: grid; gap: 6px; }
.area-row { display: grid; grid-template-columns: 14px 1fr auto auto auto; gap: 6px; align-items: center; }
.area-row i { width: 12px; height: 12px; border-radius: 3px; background: var(--c); }
.area-row .btn { padding: 5px 8px; }

.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--fg); color: var(--bg); border-radius: 10px; padding: 9px 14px; font-size: .86rem; font-weight: 600; z-index: 90; box-shadow: var(--shadow-lg); }
.sync { font-size: .74rem; color: var(--fg-3); display: inline-flex; gap: 6px; align-items: center; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.sync.busy i { background: var(--warn); }
.sync.err i { background: var(--bad); }

@media (max-width: 720px) {
  .overall .bar, .overall .counts { display: none; }
  .search { margin-left: 0; width: 100%; } .search input { width: 100%; }
  .board { grid-template-columns: repeat(4, 82vw); }
  .summary { grid-auto-flow: column; grid-template-columns: none; grid-auto-columns: 62%; overflow-x: auto; padding-bottom: 6px; }
  .grid2 { grid-template-columns: 1fr; }
}
  </style>
</head>
<body>

<div class="lock" id="lock">
  <form class="lock-card" id="login-form">
    <h1>업무 흐름</h1>
    <p>스테이지로직 내부용입니다. 비밀번호를 넣으면 이 기기에서는 다음부터 자동으로 열립니다.</p>
    <label class="field">비밀번호<input class="input" id="pass" type="password" autocomplete="current-password" required></label>
    <div style="display:flex;gap:10px;align-items:center;margin-top:14px"><button class="btn primary" type="submit">열기</button><span class="msg" id="login-msg" role="status"></span></div>
  </form>
</div>

<div class="app" id="app" hidden>
  <header class="top">
    <div class="top-row">
      <div class="brand"><b>업무 흐름</b><span>StageLogic</span></div>
      <div class="overall" aria-live="polite">
        <span class="pct mono" id="pct">0%</span>
        <div class="bar" id="pct-bar" role="img"></div>
        <span class="counts mono" id="counts"></span>
      </div>
      <span class="sync" id="sync" title="저장 상태"><i></i><span>저장됨</span></span>
      <button class="btn primary" id="new-btn" type="button">+ 새 업무 <kbd>N</kbd></button>
      <div class="menu">
        <button class="btn ghost" id="menu-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="메뉴">⋯</button>
        <div class="menu-pop" id="menu-pop" hidden>
          <button type="button" data-act="areas">분야 관리</button>
          <button type="button" data-act="name">내 이름 설정</button>
          <button type="button" data-act="theme">밝게 · 어둡게 바꾸기</button>
          <hr>
          <button type="button" data-act="export">백업 파일 내려받기</button>
          <button type="button" data-act="import">백업 파일 불러오기</button>
          <hr>
          <button type="button" data-act="logout">이 기기에서 잠그기</button>
        </div>
      </div>
    </div>
    <div class="tabs-row">
      <div class="tabs" role="tablist" id="tabs">
        <button role="tab" data-view="flow" aria-selected="true">흐름</button>
        <button role="tab" data-view="board" aria-selected="false">보드</button>
        <button role="tab" data-view="time" aria-selected="false">일정</button>
        <button role="tab" data-view="list" aria-selected="false">목록</button>
      </div>
      <label class="search"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg><input class="input" id="q" type="search" placeholder="업무 검색 ( / )" aria-label="업무 검색"></label>
    </div>
    <div class="filters" id="filters"></div>
  </header>

  <section class="summary" id="summary" aria-label="분야별 진척"></section>
  <div class="alerts" id="alerts"></div>
  <main id="view"></main>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="업무 상세"></aside>

<dialog id="add-dlg">
  <form class="dlg" id="add-form" method="dialog">
    <h2>새 업무</h2>
    <label class="field">업무 이름<input class="input" name="title" required maxlength="120" placeholder="예: 신년음악회 제안서 보내기"></label>
    <div class="grid2">
      <label class="field">분야<select class="input" name="area"></select></label>
      <label class="field">담당<input class="input" name="owner" list="owners" maxlength="20"></label>
      <label class="field">단계<select class="input" name="status"><option value="todo">할 일</option><option value="doing">진행 중</option><option value="blocked">막힘</option><option value="done">완료</option></select></label>
      <label class="field">마감일<input class="input" name="due" type="date"></label>
    </div>
    <label class="field">설명 (선택)<textarea class="input" name="detail" maxlength="1000"></textarea></label>
    <div class="dlg-foot"><span class="msg" id="add-msg"></span><button class="btn" type="button" data-close>취소</button><button class="btn primary" type="submit">추가</button></div>
  </form>
</dialog>

<dialog id="areas-dlg">
  <div class="dlg">
    <h2>분야 관리</h2>
    <p class="msg" style="margin:0">이름을 바꾸거나 순서를 옮길 수 있습니다. 업무가 남아 있는 분야는 지울 수 없고, 분야는 8개까지입니다.</p>
    <div class="area-rows" id="area-rows"></div>
    <button class="btn" type="button" id="area-add">+ 분야 추가</button>
    <div class="dlg-foot"><span class="msg" id="areas-msg"></span><button class="btn" type="button" data-close>취소</button><button class="btn primary" type="button" id="areas-save">저장</button></div>
  </div>
</dialog>

<datalist id="owners"></datalist>
<input type="file" id="import-file" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status" hidden></div>

<script>
"use strict";
// ───────── 기본값 ─────────
const STATUS = [
  { key: "todo", name: "할 일" }, { key: "doing", name: "진행 중" },
  { key: "blocked", name: "막힘" }, { key: "done", name: "완료" },
];
const SNAME = Object.fromEntries(STATUS.map((s) => [s.key, s.name]));
const ICON = {
  todo: '<svg width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>',
  doing: '<svg width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6 1.5A4.5 4.5 0 0 1 6 10.5Z" fill="currentColor"/></svg>',
  blocked: '<svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 1.2L11 10.4H1Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M6 4.6v2.6M6 8.6v.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
  done: '<svg width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="currentColor"/><path d="M3.6 6.1l1.6 1.6 3.2-3.3" fill="none" stroke="var(--surface)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};
// 같은 화면을 두 곳에서 쓴다: /work/ = 스테이지로직 업무(Blob), /me/ = J&C · 개인 업무(노션 Action_DB)
const ME = location.pathname.startsWith("/me");
const CFG = ME
  ? { api: "/api/me/", kPass: "stagelogic-me-pass", kUi: "stagelogic-me-ui", brand: "J&C · 개인", sub: "Notion", title: "J&C · 개인 흐름",
      lock: "대표 개인용입니다. 노션 Action_DB와 이어져 있어, 여기서 고치면 노션에도 바로 반영됩니다.", file: "jnc-me-flow" }
  : { api: "/api/checklist/", kPass: "stagelogic-checklist-pass", kUi: "stagelogic-flow-ui", brand: "업무 흐름", sub: "StageLogic", title: "업무 흐름 | 스테이지로직",
      lock: "스테이지로직 내부용입니다. 비밀번호를 넣으면 이 기기에서는 다음부터 자동으로 열립니다.", file: "stagelogic-workflow" };
const K_PASS = CFG.kPass, K_USER = "stagelogic-user", K_UI = CFG.kUi, K_THEME = "stagelogic-theme";
const store = {
  get(k, d = "") { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { v === "" || v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const stTag = (k) => `<span class="st ${k}">${ICON[k]}${SNAME[k]}</span>`;

// ───────── 상태 ─────────
let pass = "", me = "";
let items = [], areas = [];
let ui = { view: "flow", areas: [], owners: [], statuses: [], hideDone: false, q: "", links: true, zoom: "week", sort: ["due", 1] };
try { Object.assign(ui, JSON.parse(store.get(K_UI, "{}"))); } catch {}
ui.q = "";
const saveUi = () => store.set(K_UI, JSON.stringify({ ...ui, q: "" }));
let openId = null;

// ───────── 날짜 ─────────
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDay = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const TODAY = () => ymd(new Date());
const daysBetween = (a, b) => Math.round((parseDay(b) - parseDay(a)) / 864e5);
const addDays = (s, n) => { const d = parseDay(s); d.setDate(d.getDate() + n); return ymd(d); };
const shortDay = (s) => { const d = parseDay(s); return `${d.getMonth() + 1}.${d.getDate()}`; };
function dueTag(it) {
  if (!it.due || it.status === "done") return it.due ? `<span class="tag">${shortDay(it.due)}</span>` : "";
  const left = daysBetween(TODAY(), it.due);
  if (left < 0) return `<span class="tag over">${-left}일 지남</span>`;
  if (left === 0) return `<span class="tag soon">오늘 마감</span>`;
  if (left <= 3) return `<span class="tag soon">D-${left}</span>`;
  return `<span class="tag">${shortDay(it.due)}</span>`;
}
const relTime = (iso) => {
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (s < 60) return "방금"; if (s < 3600) return `${Math.floor(s / 60)}분 전`;
  if (s < 86400) return `${Math.floor(s / 3600)}시간 전`;
  const d = new Date(iso); return `${d.getMonth() + 1}.${d.getDate()}`;
};

// ───────── 서버 ─────────
async function api(method, body) {
  const headers = { "Content-Type": "application/json", "x-checklist-pass": pass };
  const name = store.get(K_USER); if (name) headers["x-checklist-user"] = encodeURIComponent(name);
  const res = await fetch(CFG.api, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(data.error || "error"); e.status = res.status; e.missing = data.missing || []; throw e; }
  return data;
}
// 바꾸는 요청은 하나씩 차례로 보낸다. 화면은 먼저 바꿔 두고, 서버 답으로 맞춘다.
let queue = Promise.resolve(), pending = 0;
function setSync(state) {
  const el = $("#sync"); el.className = "sync" + (state === "busy" ? " busy" : state === "err" ? " err" : "");
  el.lastElementChild.textContent = state === "busy" ? "저장 중…" : state === "err" ? "저장 실패" : "저장됨";
}
function send(body, optimistic) {
  if (optimistic) { optimistic(); render(); }
  pending++; setSync("busy");
  const job = queue.then(async () => {
    try {
      const data = await api("POST", body);
      pending--;
      if (!pending) { take(data); setSync("ok"); }
      return data;
    } catch (err) {
      pending--; setSync("err");
      if (err.status === 401) { lock("비밀번호가 바뀌었거나 맞지 않습니다."); return; }
      toast(err.message === "area_in_use" ? "업무가 남아 있는 분야는 지울 수 없습니다." : err.message === "notion_managed" ? "분야는 노션 Action_DB의 '분야' 선택지에서 바꿔 주세요." : "저장하지 못했습니다. 최신 내용으로 다시 불러옵니다.");
      await refresh();
      return null;
    }
  });
  queue = job.catch(() => {}); // 하나가 실패해도 다음 요청은 계속 보낸다
  return queue;
}
function take(data) {
  if (!data) return;
  items = data.items || []; areas = data.areas || areas; me = data.me || me;
  // 아직 보내지 않은 입력은 화면에서 지키기
  const open = items.find((i) => i.id === openId); if (open) Object.assign(open, editPatch);
  render();
}
const drawerBusy = () => { const a = document.activeElement; return !!(a && $("#drawer").contains(a) && a.dataset.f); };
async function refresh() {
  if (pending) return;
  try { take(await api("GET")); } catch (e) { if (e.status === 401) lock("비밀번호가 맞지 않습니다."); }
}

// ───────── 계산 ─────────
const areaOf = (k) => areas.find((a) => a.key === k) || { key: k, name: k };
// 노션 분야는 노션에서 고른 색을 따른다
const NOTION_COLOR = { blue: 1, orange: 2, green: 3, yellow: 4, pink: 5, purple: 7, red: 8, brown: 9 };
const colorOf = (k) => {
  const i = areas.findIndex((a) => a.key === k); if (i < 0) return "var(--fg-3)";
  const c = areas[i].color; if (c) return NOTION_COLOR[c] ? `var(--a${NOTION_COLOR[c]})` : "var(--fg-3)";
  return i > 8 ? "var(--fg-3)" : `var(--a${i + 1})`;
};
const score = (list) => list.length ? list.reduce((s, i) => s + (i.status === "done" ? 1 : i.status === "doing" ? .5 : 0), 0) / list.length : 0;
const owners = () => [...new Set(["대표", "Claude", "함께", ...items.map((i) => i.owner)].filter(Boolean))];
function visible() {
  const q = ui.q.trim().toLowerCase();
  return items.filter((i) =>
    (!ui.areas.length || ui.areas.includes(i.area)) &&
    (!ui.owners.length || ui.owners.includes(i.owner)) &&
    (!ui.statuses.length || ui.statuses.includes(i.status)) &&
    (!ui.hideDone || i.status !== "done") &&
    (!q || `${i.title} ${i.detail} ${i.note} ${i.owner}`.toLowerCase().includes(q)));
}
const byOrder = (a, b) => (a.order ?? 0) - (b.order ?? 0) || a.title.localeCompare(b.title, "ko");
function orderBetween(prev, next) {
  if (prev && next) return (prev.order + next.order) / 2;
  if (prev) return prev.order + 1;
  if (next) return next.order - 1;
  return 1;
}

// ───────── 그리기: 공통 ─────────
function render() {
  renderTop(); renderFilters(); renderSummary(); renderAlerts();
  const v = $("#view");
  const scroll = { x: lastView === ui.view ? (v.querySelector(".flow-wrap, .tl, .board, .table-wrap")?.scrollLeft || 0) : null };
  v.innerHTML = "";
  if (!items.length) { v.innerHTML = `<div class="empty"><p><b>아직 업무가 없습니다.</b></p><p>오른쪽 위 <b>+ 새 업무</b>로 추가하거나, 메뉴의 <b>백업 파일 불러오기</b>로 한 번에 가져오세요.</p></div>`; }
  else ({ flow: renderFlow, board: renderBoard, time: renderTime, list: renderList })[ui.view](v);
  const sc = v.querySelector(".flow-wrap, .tl, .board, .table-wrap"); if (sc && scroll.x !== null) sc.scrollLeft = scroll.x;
  $$("#tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.view === ui.view)));
  $("#owners").innerHTML = owners().map((o) => `<option value="${esc(o)}">`).join("");
  if (openId && !drawerBusy()) renderDrawer();
  lastView = ui.view;
}
let lastView = null;
function renderTop() {
  const n = items.length, by = (s) => items.filter((i) => i.status === s).length;
  $("#pct").textContent = Math.round(score(items) * 100) + "%";
  const d = n ? by("done") / n * 100 : 0, g = n ? by("doing") / n * 100 : 0;
  $("#pct-bar").innerHTML = `<i class="d" style="width:${d}%"></i><i class="g" style="width:${g}%"></i>`;
  $("#pct-bar").setAttribute("aria-label", `완료 ${Math.round(d)}%, 진행 중 ${Math.round(g)}%`);
  $("#counts").textContent = `완료 ${by("done")} · 진행 ${by("doing")} · 막힘 ${by("blocked")} · 할 일 ${by("todo")}`;
}
function chip(group, value, label, color) {
  const on = ui[group].includes(value);
  return `<button type="button" class="chip" data-g="${group}" data-v="${esc(value)}" aria-pressed="${on}">${color ? `<span class="dot" style="--c:${color}"></span>` : ""}${esc(label)}</button>`;
}
function renderFilters() {
  const f = $("#filters");
  const any = ui.areas.length || ui.owners.length || ui.statuses.length || ui.hideDone;
  f.innerHTML = areas.map((a) => chip("areas", a.key, a.name, colorOf(a.key))).join("") +
    `<span class="sep"></span>` + owners().filter((o) => items.some((i) => i.owner === o)).map((o) => chip("owners", o, o)).join("") +
    `<span class="sep"></span>` + STATUS.map((s) => chip("statuses", s.key, s.name)).join("") +
    `<button type="button" class="chip" data-g="hideDone" aria-pressed="${ui.hideDone}">완료 숨기기</button>` +
    (any ? `<button type="button" class="clear" data-g="clear">필터 지우기</button>` : "");
}
function renderSummary() {
  $("#summary").innerHTML = areas.map((a) => {
    const l = items.filter((i) => i.area === a.key);
    const done = l.filter((i) => i.status === "done").length, doing = l.filter((i) => i.status === "doing").length;
    const blocked = l.filter((i) => i.status === "blocked").length;
    return `<button type="button" class="sum-card" data-area="${a.key}" aria-pressed="${ui.areas.length === 1 && ui.areas[0] === a.key}" style="--c:${colorOf(a.key)}">
      <span class="sum-head"><span class="dot"></span><span>${esc(a.name)}</span><em>${Math.round(score(l) * 100)}%</em></span>
      <span class="bar"><i class="d" style="width:${l.length ? done / l.length * 100 : 0}%"></i><i class="g" style="width:${l.length ? doing / l.length * 100 : 0}%"></i></span>
      <span class="sum-meta">완료 ${done} / ${l.length}${doing ? ` · 진행 ${doing}` : ""}${blocked ? ` · 막힘 ${blocked}` : ""}</span>
    </button>`;
  }).join("");
}
function renderAlerts() {
  const open = items.filter((i) => i.status !== "done");
  const over = open.filter((i) => i.due && daysBetween(TODAY(), i.due) < 0);
  const soon = open.filter((i) => i.due && daysBetween(TODAY(), i.due) >= 0 && daysBetween(TODAY(), i.due) <= 3);
  const blocked = open.filter((i) => i.status === "blocked");
  const mine = me ? open.filter((i) => i.owner === me && i.status === "doing") : [];

      <p class="sec-t">먼저 끝나야 하는 업무 (선행)</p>
      <div class="deps">${it.deps.map((x) => { const o = items.find((i) => i.id === x); return o ? `<span class="dep" style="--c:${colorOf(o.area)}">${ICON[o.status]}<b>${esc(o.title)}</b><button type="button" data-undep="${esc(x)}" aria-label="선행 업무에서 빼기">×</button></span>` : ""; }).join("")}
      <select class="input" data-adddep style="max-width:100%"><option value="">+ 선행 업무 추가</option>${areas.map((a) => { const l = others.filter((o) => o.area === a.key); return l.length ? `<optgroup label="${esc(a.name)}">${l.map((o) => `<option value="${esc(o.id)}">${esc(o.title)}</option>`).join("")}</optgroup>` : ""; }).join("")}</select></div>
      ${after.length ? `<p class="sec-t" style="margin-top:10px">이 일을 기다리는 업무</p><div class="deps">${after.map((o) => `<span class="dep after">${ICON[o.status]}<b>${esc(o.title)}</b></span>`).join("")}</div>` : ""}
    </div>
    <div><p class="sec-t">기록</p><ul class="log">${[...it.log].reverse().map((l) => `<li><time>${relTime(l.at)}</time><span><b>${esc(l.by)}</b> · ${esc(l.text)}</span></li>`).join("") || `<li><time></time><span>아직 기록이 없습니다.</span></li>`}</ul></div>
  </div>
  <div class="d-foot"><button class="btn danger" type="button" data-del>삭제</button>${it.url ? `<a class="btn ghost" href="${esc(it.url)}" target="_blank" rel="noopener" style="text-decoration:none">노션에서 열기 ↗</a>` : ""}<span class="msg" style="margin-left:auto">${it.updatedAt ? "최근 변경 " + relTime(it.updatedAt) : ""}</span></div>`;
  if (active) { const el = d.querySelector(`[data-f="${active}"]`); if (el) { el.focus(); if (el.setSelectionRange && el.type !== "date") { const n = el.value.length; el.setSelectionRange(n, n); } } }
}
function chainDown(id) { const out = new Set(), walk = (x) => items.filter((i) => i.deps.includes(x)).forEach((i) => { if (!out.has(i.id)) { out.add(i.id); walk(i.id); } }); walk(id); return out; }

// ───────── 이벤트 ─────────
document.addEventListener("click", (e) => {
  const t = e.target;
  const c = t.closest(".card"); if (c && !t.closest("button")) { openDrawer(c.dataset.id); return; }
  const op = t.closest("[data-open]"); if (op) { openDrawer(op.dataset.open); return; }
  const tab = t.closest("#tabs button"); if (tab) { ui.view = tab.dataset.view; saveUi(); render(); return; }
  const z = t.closest("[data-zoom]"); if (z) { ui.zoom = z.dataset.zoom; saveUi(); render(); return; }
  const ch = t.closest("#filters [data-g]");
  if (ch) { const g = ch.dataset.g;
    if (g === "clear") Object.assign(ui, { areas: [], owners: [], statuses: [], hideDone: false });
    else if (g === "hideDone") ui.hideDone = !ui.hideDone;
    else { const v = ch.dataset.v; ui[g] = ui[g].includes(v) ? ui[g].filter((x) => x !== v) : [...ui[g], v]; }
    saveUi(); render(); return; }
  const sc = t.closest(".sum-card"); if (sc) { const k = sc.dataset.area; ui.areas = ui.areas.length === 1 && ui.areas[0] === k ? [] : [k]; saveUi(); render(); return; }
  const al = t.closest(".alert");
  if (al) { if (al.dataset.st) { ui.statuses = [al.dataset.st]; } else if (al.dataset.owner) { ui.owners = [al.dataset.owner]; ui.statuses = ["doing"]; } else { ui.view = "list"; ui.sort = ["due", 1]; ui.hideDone = true; } saveUi(); render(); return; }
  const srt = t.closest("[data-sort]"); if (srt) { const k = srt.dataset.sort; ui.sort = [k, ui.sort[0] === k ? -ui.sort[1] : 1]; saveUi(); render(); return; }
  const ah = t.closest(".add-here"); if (ah) { openAdd({ area: ah.dataset.area, status: ah.dataset.status }); return; }
  if (t.closest("[data-close-drawer]") || t === $("#scrim")) { closeDrawer(); return; }
  const st = t.closest("#drawer [data-st]"); if (st) { const it = items.find((i) => i.id === openId); if (it && it.status !== st.dataset.st) send({ op: "status", id: it.id, status: st.dataset.st }, () => { it.status = st.dataset.st; }); return; }
  const ud = t.closest("[data-undep]"); if (ud) { const it = items.find((i) => i.id === openId); const deps = it.deps.filter((x) => x !== ud.dataset.undep); send({ op: "update", id: it.id, fields: { deps } }, () => { it.deps = deps; }); return; }
  const del = t.closest("[data-del]");
  if (del) { if (!del.classList.contains("armed")) { del.classList.add("armed"); del.textContent = "한 번 더 누르면 삭제"; setTimeout(() => { if (del.isConnected) { del.classList.remove("armed"); del.textContent = "삭제"; } }, 4000); return; }
    const id = openId; closeDrawer(); send({ op: "delete", id }, () => { items = items.filter((i) => i.id !== id).map((i) => ({ ...i, deps: i.deps.filter((x) => x !== id) })); }); toast(ME ? "노션 휴지통으로 옮겼습니다." : "삭제했습니다."); return; }
  if (t.closest("#new-btn")) { openAdd({}); return; }
  if (t.closest("#menu-btn")) { const p = $("#menu-pop"); p.hidden = !p.hidden; $("#menu-btn").setAttribute("aria-expanded", String(!p.hidden)); return; }
  const act = t.closest("#menu-pop [data-act]"); if (act) { $("#menu-pop").hidden = true; menu(act.dataset.act); return; }
  if (!t.closest(".menu")) $("#menu-pop").hidden = true;
  if (t.closest("[data-close]")) t.closest("dialog").close();
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.id === "links-tg") { ui.links = t.checked; saveUi(); drawLinks(); return; }
  if (t.matches("#drawer [data-adddep]") && t.value) { const it = items.find((i) => i.id === openId); const deps = [...it.deps, t.value]; send({ op: "update", id: it.id, fields: { deps } }, () => { it.deps = deps; }); return; }
  if (t.matches("#drawer [data-f]") && (t.tagName === "SELECT" || t.type === "date")) { queueEdit(t.dataset.f, t.value); flushEdits(); }
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "q") { ui.q = t.value; render(); return; }
  if (t.matches("#drawer [data-f]") && t.tagName !== "SELECT" && t.type !== "date") { if (t.dataset.f === "title" && !t.value.trim()) return; queueEdit(t.dataset.f, t.value); }
});
document.addEventListener("focusout", (e) => { if (e.target.matches && e.target.matches("#drawer [data-f]")) flushEdits(); });
document.addEventListener("mouseover", (e) => { const c = e.target.closest(".flow .card"); if (c && ui.links) drawLinks(c.dataset.id); });
document.addEventListener("mouseout", (e) => { const c = e.target.closest(".flow .card"); if (c && !c.contains(e.relatedTarget) && ui.links) drawLinks(); });
document.addEventListener("keydown", (e) => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || document.querySelector("dialog[open]");
  if (e.key === "Escape") { if (!$("#drawer").hidden) closeDrawer(); $("#menu-pop").hidden = true; return; }
  if (e.key === "Enter" && document.activeElement.classList.contains("card")) { openDrawer(document.activeElement.dataset.id); return; }
  if (typing || $("#app").hidden) return;
  if (e.key === "n" || e.key === "N" || e.key === "ㅜ") { e.preventDefault(); openAdd({}); }
  else if (e.key === "/") { e.preventDefault(); $("#q").focus(); }
  else if ("1234".includes(e.key) && e.key.length === 1) { ui.view = ["flow", "board", "time", "list"][Number(e.key) - 1]; saveUi(); render(); }
});
window.addEventListener("resize", () => { if (ui.view === "flow") drawLinks(); });

// 새 업무
function openAdd(preset) {
  const f = $("#add-form");
  f.area.innerHTML = areas.map((a) => `<option value="${a.key}">${esc(a.name)}</option>`).join("");
  f.reset(); f.area.value = preset.area || (ui.areas[0] || areas[0].key); f.status.value = preset.status || "todo";
  f.owner.value = store.get(K_USER) || me || "대표"; $("#add-msg").textContent = "";
  $("#add-dlg").showModal(); f.title.focus();
}
$("#add-form").addEventListener("submit", (e) => {
  e.preventDefault(); const f = e.target, title = f.title.value.trim(); if (!title) return;
  const item = { title, area: f.area.value, owner: f.owner.value.trim() || "대표", status: f.status.value, due: f.due.value, detail: f.detail.value.trim() };
  $("#add-dlg").close();
  send({ op: "add", item }, () => { items.push({ ...item, id: "tmp-" + Date.now(), order: 1e9, note: "", start: "", deps: [], log: [], updatedAt: new Date().toISOString() }); });
  toast(`‘${title}’을(를) 추가했습니다.`);
});

// 분야 관리
let draftAreas = [];
function renderAreaRows() {
  $("#area-rows").innerHTML = draftAreas.map((a, i) => `<div class="area-row" style="--c:${i < 8 ? `var(--a${i + 1})` : "var(--fg-3)"}"><i></i><input class="input" data-i="${i}" value="${esc(a.name)}" maxlength="30" aria-label="분야 이름"><button class="btn" type="button" data-up="${i}" aria-label="위로" ${i ? "" : "disabled"}>↑</button><button class="btn" type="button" data-down="${i}" aria-label="아래로" ${i < draftAreas.length - 1 ? "" : "disabled"}>↓</button><button class="btn danger" type="button" data-rm="${i}" ${items.some((x) => x.area === a.key) ? `disabled title="업무가 남아 있습니다"` : ""}>삭제</button></div>`).join("");
  $("#area-add").disabled = draftAreas.length >= 8;
}
$("#area-rows").addEventListener("input", (e) => { const i = e.target.dataset.i; if (i !== undefined) draftAreas[i].name = e.target.value; });
$("#area-rows").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const sw = (i, j) => { [draftAreas[i], draftAreas[j]] = [draftAreas[j], draftAreas[i]]; };
  if (b.dataset.up) sw(+b.dataset.up, +b.dataset.up - 1); else if (b.dataset.down) sw(+b.dataset.down, +b.dataset.down + 1); else if (b.dataset.rm) draftAreas.splice(+b.dataset.rm, 1);
  renderAreaRows();
});
$("#area-add").addEventListener("click", () => { draftAreas.push({ key: "", name: "새 분야" }); renderAreaRows(); $$("#area-rows input").at(-1).select(); });
$("#areas-save").addEventListener("click", () => {
  const list = draftAreas.map((a) => ({ key: a.key, name: a.name.trim() })).filter((a) => a.name);
  if (!list.length) { $("#areas-msg").textContent = "분야가 하나는 있어야 합니다."; return; }
  $("#areas-dlg").close(); send({ op: "areas", areas: list }, () => { areas = list.map((a) => ({ ...a, key: a.key || "tmp" + Math.random() })); });
});

function menu(act) {
  if (act === "areas") { draftAreas = areas.map((a) => ({ ...a })); $("#areas-msg").textContent = ""; renderAreaRows(); $("#areas-dlg").showModal(); }
  else if (act === "name") { const n = prompt("기록에 남길 이름을 입력하세요. (예: 대표, 김실장)", store.get(K_USER) || me || ""); if (n !== null) { store.set(K_USER, n.trim().slice(0, 20)); toast("이 기기에서 쓰는 이름을 바꿨습니다."); refresh(); } }
  else if (act === "theme") { const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; const next = dark ? "light" : "dark"; document.documentElement.dataset.theme = next; store.set(K_THEME, next); requestAnimationFrame(() => drawLinks()); }
  else if (act === "export") { const blob = new Blob([JSON.stringify({ items, areas, exportedAt: new Date().toISOString() }, null, 2)], { type: "application/json" }); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `${CFG.file}-${TODAY()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
  else if (act === "import") { if (items.length) { toast("업무가 하나도 없을 때만 불러올 수 있습니다. 먼저 백업을 내려받아 두세요."); return; } $("#import-file").click(); }
  else if (act === "logout") lock("");
}
$("#import-file").addEventListener("change", async (e) => {
  const file = e.target.files[0]; if (!file) return; e.target.value = "";
  try { const data = JSON.parse(await file.text()); send({ op: "import", items: Array.isArray(data) ? data : data.items, areas: data.areas }); }
  catch { toast("백업 파일 형식이 아닙니다."); }
});

let toastT = null;
function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }

// ───────── 잠금 · 시작 ─────────
function setupMsg(err) {
  const names = { storage: "Blob 저장소 연결", password: ME ? "ME_PASSWORD" : "CHECKLIST_PASSWORD", notion: "NOTION_TOKEN", notion_share: "노션 통합에 Action_DB 공유" };
  const m = (err.missing || []).map((k) => names[k] || k);
  return "서버 설정이 아직 끝나지 않았습니다." + (m.length ? " (빠진 것: " + m.join(", ") + ")" : "");
}
function lock(message) {
  pass = ""; store.set(K_PASS, ""); closeDrawer();
  $("#app").hidden = true; $("#lock").hidden = false; $("#login-msg").textContent = message; $("#pass").value = ""; $("#pass").focus();
}
async function unlock(p) {
  pass = p;
  try { const data = await api("GET"); store.set(K_PASS, p); $("#lock").hidden = true; $("#app").hidden = false; take(data); }
  catch (err) { lock(err.status === 401 ? "비밀번호가 맞지 않습니다." : err.status === 503 ? setupMsg(err) : "연결하지 못했습니다. 잠시 후 다시 시도해 주세요."); }
}
$("#login-form").addEventListener("submit", (e) => { e.preventDefault(); unlock($("#pass").value); });
window.addEventListener("focus", () => { if (pass && !openId) refresh(); });
setInterval(() => { if (pass && !openId && !document.hidden && !document.querySelector("dialog[open]")) refresh(); }, 60000);
document.title = CFG.title;
$(".brand").innerHTML = `<b>${esc(CFG.brand)}</b><span>${esc(CFG.sub)}</span>`;
$(".lock-card h1").textContent = CFG.brand; $(".lock-card p").textContent = CFG.lock;
if (ME) $$('#menu-pop [data-act="areas"], #menu-pop [data-act="import"], #menu-pop [data-act="name"]').forEach((b) => { b.hidden = true; });
const theme = store.get(K_THEME); if (theme) document.documentElement.dataset.theme = theme;
const saved = store.get(K_PASS); if (saved) unlock(saved); else lock("");
</script>
</body>
</html>
