<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>업무 흐름 | 스테이지로직</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <!-- 앱으로 설치할 때 쓰는 이름 · 아이콘: /me/ 와 /work/ 가 이 파일을 같이 쓰므로 주소에 따라 고른다 -->
  <script>
    (function () {
      var me = location.pathname.indexOf("/me") === 0, k = me ? "me" : "work";
      var add = function (rel, href, extra) { var l = document.createElement("link"); l.rel = rel; l.href = href; for (var x in extra || {}) l.setAttribute(x, extra[x]); document.head.appendChild(l); };
      add("manifest", "/assets/app/" + k + ".webmanifest");
      add("apple-touch-icon", "/assets/app/" + k + "-apple-180.png");
      if (me) add("icon", "/assets/app/me-192.png", { type: "image/png", sizes: "192x192" });
      var t = document.createElement("meta"); t.name = "apple-mobile-web-app-title"; t.content = me ? "개인 일정" : "업무 흐름"; document.head.appendChild(t);
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
/* 색: 분야 = 구별용 8색(고정 순서), 상태 = 완료/막힘만 상태색 + 아이콘 + 글자 */
:root {
  color-scheme: light;
  --bg: #f4f3ef; --surface: #fcfcfb; --surface-2: #f0efea; --line: #e3e1da; --line-2: #d3d0c6;
  --fg: #0b0b0b; --fg-2: #52514e; --fg-3: #7b7a74;
  --accent: #2a78d6; --accent-soft: #e3eefb;
  --good: #0ca30c; --good-ink: #006300; --good-soft: #e3f4e3;
  --warn: #fab219; --warn-ink: #8a5a00; --warn-soft: #fdf1d6;
  --bad: #d03b3b; --bad-ink: #b02a2a; --bad-soft: #f9e3e3;
  --a1: #2a78d6; --a2: #eb6834; --a3: #1baf7a; --a4: #eda100; --a5: #e87ba4; --a6: #008300; --a7: #6250d6; --a8: #e34948; --a9: #96643c;
  --shadow: 0 1px 2px rgba(20,20,10,.06), 0 4px 14px rgba(20,20,10,.06);
  --shadow-lg: 0 12px 40px rgba(20,20,10,.18);
  --font: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #222220; --line: #2e2d2a; --line-2: #3d3c38;
  --fg: #f0efec; --fg-2: #c3c2b7; --fg-3: #8f8e86;
  --accent: #3987e5; --accent-soft: #1b2b40;
  --good-ink: #5fd35f; --good-soft: #17301a; --warn-ink: #fab219; --warn-soft: #3a2e12; --bad-ink: #f07d7d; --bad-soft: #3a1d1d;
  --a1: #3987e5; --a2: #d95926; --a3: #199e70; --a4: #c98500; --a5: #d55181; --a6: #008300; --a7: #9085e9; --a8: #e66767; --a9: #b9875e;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3); --shadow-lg: 0 12px 40px rgba(0,0,0,.55);
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #222220; --line: #2e2d2a; --line-2: #3d3c38;
  --fg: #f0efec; --fg-2: #c3c2b7; --fg-3: #8f8e86;
  --accent: #3987e5; --accent-soft: #1b2b40;
  --good-ink: #5fd35f; --good-soft: #17301a; --warn-ink: #fab219; --warn-soft: #3a2e12; --bad-ink: #f07d7d; --bad-soft: #3a1d1d;
  --a1: #3987e5; --a2: #d95926; --a3: #199e70; --a4: #c98500; --a5: #d55181; --a6: #008300; --a7: #9085e9; --a8: #e66767; --a9: #b9875e;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3); --shadow-lg: 0 12px 40px rgba(0,0,0,.55);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-variant-numeric: tabular-nums; }

/* 잠금 화면 */
.lock { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.lock-card { width: min(380px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px; box-shadow: var(--shadow); }
.lock-card h1 { margin: 0 0 4px; font-size: 1.35rem; }
.lock-card p { margin: 0 0 18px; color: var(--fg-2); }
.field { display: grid; gap: 6px; font-size: .82rem; font-weight: 600; color: var(--fg-2); }
.input { width: 100%; background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 11px; font-size: .95rem; min-width: 0; }
.input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
textarea.input { resize: vertical; min-height: 72px; line-height: 1.55; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 10px; padding: 7px 12px; font-weight: 600; font-size: .88rem; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn.primary:hover { opacity: .9; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.danger { color: var(--bad-ink); }
.btn.danger.armed { background: var(--bad-soft); border-color: transparent; }
.btn kbd { font: inherit; font-size: .72rem; opacity: .6; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; }
.msg { font-size: .85rem; color: var(--fg-2); min-height: 1.4em; }

/* 머리 */
.app { min-height: 100vh; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; gap: 14px; padding: 10px 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 8px; margin-right: auto; min-width: 0; }
.brand b { font-size: 1.05rem; letter-spacing: -.01em; }
.brand span { color: var(--fg-3); font-size: .8rem; font-weight: 600; }
.overall { display: flex; align-items: center; gap: 10px; }
.overall .pct { font-size: 1.25rem; font-weight: 800; letter-spacing: -.02em; }
.overall .bar { width: 140px; }
.overall .counts { font-size: .78rem; color: var(--fg-2); white-space: nowrap; }
.bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; display: flex; gap: 2px; }
.bar i { display: block; height: 100%; border-radius: 99px; }
.bar .d { background: var(--good); } .bar .g { background: var(--fg-3); }
.tabs-row { display: flex; align-items: center; gap: 10px; padding: 0 16px 8px; flex-wrap: wrap; }
.tabs { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.tabs button { border: 0; background: transparent; border-radius: 7px; padding: 5px 12px; font-weight: 600; font-size: .86rem; color: var(--fg-2); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.search { position: relative; margin-left: auto; }
.search input { width: 220px; padding-left: 30px; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--fg-3); }
.menu { position: relative; }
.menu-pop { position: absolute; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 6px; min-width: 200px; z-index: 50; }
.menu-pop button { display: flex; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; font-size: .88rem; gap: 8px; }
.menu-pop button:hover { background: var(--surface-2); }
.menu-pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

/* 필터 */
.filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 10px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 99px; padding: 3px 10px; font-size: .8rem; font-weight: 600; color: var(--fg-2); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--fg-3)); flex: none; }
.chip[aria-pressed="true"] .dot { box-shadow: 0 0 0 2px var(--bg); }
.filters .sep { width: 1px; height: 18px; background: var(--line-2); margin: 0 4px; }
.filters .clear { border: 0; background: none; color: var(--accent); font-size: .8rem; font-weight: 600; }

/* 요약 */
.summary { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; padding: 14px 16px 4px; }
.sum-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; text-align: left; display: grid; gap: 8px; min-width: 0; }
.sum-card[aria-pressed="true"] { border-color: var(--fg); box-shadow: 0 0 0 1px var(--fg); }
.sum-head { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: .9rem; min-width: 0; }
.sum-head span:not(.dot) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sum-head .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }
.sum-head em { margin-left: auto; font-style: normal; font-weight: 800; font-variant-numeric: tabular-nums; }
.sum-meta { font-size: .76rem; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.alerts { display: flex; gap: 8px; flex-wrap: wrap; padding: 8px 16px 0; }
.alert { display: inline-flex; gap: 6px; align-items: center; font-size: .8rem; font-weight: 600; border-radius: 8px; padding: 4px 10px; border: 1px solid transparent; background: var(--surface); }
.alert.over { background: var(--bad-soft); color: var(--bad-ink); }
.alert.soon { background: var(--warn-soft); color: var(--warn-ink); }
.alert.block { background: var(--bad-soft); color: var(--bad-ink); }
.alert.mine { border-color: var(--line-2); color: var(--fg-2); }
.alert[aria-pressed="true"] { border-color: currentColor; box-shadow: inset 0 0 0 1px currentColor; }

main { flex: 1; padding: 12px 16px 60px; min-width: 0; }

/* 상태 표시 (아이콘 + 글자) */
.st { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; font-weight: 700; border-radius: 99px; padding: 2px 8px 2px 6px; white-space: nowrap; }
.st svg { flex: none; }
.st.todo { background: var(--surface-2); color: var(--fg-2); }
.st.doing { background: var(--accent-soft); color: var(--accent); }
.st.blocked { background: var(--bad-soft); color: var(--bad-ink); }
.st.done { background: var(--good-soft); color: var(--good-ink); }

/* 카드 */
.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px 9px 13px; box-shadow: 0 1px 1px rgba(0,0,0,.03); cursor: pointer; display: grid; gap: 6px; min-width: 0; transition: box-shadow .12s, border-color .12s, opacity .12s; }
.card::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--c); }
.card:hover { border-color: var(--line-2); box-shadow: var(--shadow); }
.card.is-done { opacity: .62; }
.card.is-done .c-title { text-decoration: line-through; text-decoration-color: var(--line-2); }
.card.dragging { opacity: .35; }
.card.dim { opacity: .25; }
.card.hl { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.c-title { font-weight: 650; font-size: .88rem; line-height: 1.35; overflow-wrap: anywhere; }
.c-meta { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: .72rem; color: var(--fg-2); }
.who { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; }
.who i { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: .62rem; font-weight: 800; background: var(--surface-2); color: var(--fg-2); border: 1px solid var(--line-2); }
.who.claude i { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.tag { display: inline-flex; align-items: center; gap: 3px; border-radius: 6px; padding: 0 6px; font-weight: 700; font-variant-numeric: tabular-nums; background: var(--surface-2); }
.tag.over { background: var(--bad-soft); color: var(--bad-ink); }
.tag.soon { background: var(--warn-soft); color: var(--warn-ink); }
.c-detail { font-size: .78rem; color: var(--fg-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.c-note { font-size: .76rem; background: var(--surface-2); border-radius: 6px; padding: 4px 7px; color: var(--fg-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* 흐름: 분야(가로줄) × 단계(세로줄) */
.flow-wrap { position: relative; overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface-2); }
.flow { position: relative; display: grid; grid-template-columns: 170px repeat(4, minmax(210px, 1fr)); min-width: 1010px; }
.flow .hcell { position: sticky; top: 0; z-index: 3; background: var(--surface-2); padding: 10px 12px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: .82rem; display: flex; align-items: center; gap: 8px; }
.flow .hcell em { font-style: normal; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.lane-h { position: sticky; left: 0; z-index: 2; background: var(--surface-2); border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 12px; display: grid; align-content: start; gap: 8px; }
.lane-h b { display: flex; align-items: center; gap: 8px; font-size: .88rem; }
.lane-h b i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }
.lane-h .sum-meta { font-size: .72rem; }
.cell { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 64px; transition: background .1s; }
.cell:last-child { border-right: 0; }
.cell.over { background: var(--accent-soft); }
.cell .add-here { border: 1px dashed var(--line-2); background: transparent; border-radius: 8px; color: var(--fg-3); font-size: .76rem; padding: 4px; opacity: 0; transition: opacity .1s; }
.cell:hover .add-here, .col:hover .add-here { opacity: 1; }
.links { position: absolute; inset: 0; pointer-events: none; z-index: 1; overflow: visible; }
.links path.lk { fill: none; stroke: var(--fg-3); stroke-width: 1.5; }
.links path.lk.wait { stroke-dasharray: 5 4; }
.links path.lk.hl { stroke: var(--accent); stroke-width: 2.25; }
.flow .card { z-index: 2; }

/* 보드 */
.board { display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.col { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 200px; }
.col.over { background: var(--accent-soft); }
.col-h { display: flex; align-items: center; gap: 8px; padding: 2px 4px 6px; font-weight: 700; }
.col-h em { font-style: normal; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.drop-mark { height: 3px; background: var(--accent); border-radius: 3px; margin: -2px 0; }

/* 달력 (/me/) */
.cal-tools { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.cal-tools h3 { margin: 0 6px; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); }
.cal-h { padding: 6px 8px; font-size: .74rem; font-weight: 700; color: var(--fg-3); border-bottom: 1px solid var(--line); background: var(--surface-2); }
.cal-h.sun, .cal-d.sun .cal-n { color: var(--a8); }
.cal-d { min-height: 104px; padding: 4px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; min-width: 0; cursor: cell; }
.cal-d:nth-child(7n) { border-right: 0; }
.cal-d.out { background: var(--surface-2); }
.cal-d.out > * { opacity: .55; }
.cal-d.over { background: var(--accent-soft); }
.cal-n { font-size: .74rem; font-weight: 700; color: var(--fg-2); font-variant-numeric: tabular-nums; padding: 1px 4px; align-self: flex-start; border-radius: 6px; }
.cal-d.now .cal-n { background: var(--accent); color: #fff; }
.cal-it { display: block; width: 100%; text-align: left; font: inherit; font-size: .72rem; font-weight: 650; line-height: 1.25; padding: 2px 6px; border-radius: 5px; border: 0; border-left: 3px solid var(--c); background: color-mix(in srgb, var(--c) 16%, var(--surface)); color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: grab; }
.cal-it.done { opacity: .5; text-decoration: line-through; }
.cal-it.blocked { border-left-style: dashed; }
.cal-it.span { background: color-mix(in srgb, var(--c) 8%, var(--surface)); font-weight: 500; color: var(--fg-2); }
.cal-d.sel { box-shadow: inset 0 0 0 2px var(--accent); }
.cal-day { margin-top: 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 10px 12px; }
.cal-day h4 { margin: 0 0 8px; font-size: .9rem; display: flex; align-items: center; gap: 8px; }
.cal-day h4 .btn { margin-left: auto; }
.cal-day .cal-it { font-size: .85rem; padding: 6px 8px; margin-bottom: 4px; white-space: normal; }
.cal-more { font-size: .7rem; color: var(--fg-3); padding: 0 6px; background: none; border: 0; text-align: left; cursor: pointer; }
@media (max-width: 640px) { .cal-d { min-height: 72px; padding: 2px; } .cal-it { font-size: .64rem; padding: 1px 3px; } .cal-h { padding: 4px; } }

/* 날짜 고르기 (브라우저 기본 달력은 기기 언어를 따라 미국식으로 보일 수 있어 직접 그린다) */
.dp-src { display: none !important; }
.dp-btn { text-align: left; cursor: pointer; color: var(--fg); font: inherit; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dp-btn.dp-none { color: var(--fg-3); }
.dp-pop { position: fixed; z-index: 1000; width: 272px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; box-shadow: 0 12px 32px rgba(0,0,0,.18); padding: 10px; }
.dp-head { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.dp-head b { flex: 1; text-align: center; font-size: .92rem; }
.dp-head button, .dp-foot button { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; color: var(--fg); font: inherit; font-size: .82rem; }
.dp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
.dp-grid span { font-size: .7rem; color: var(--fg-3); padding: 4px 0; font-weight: 700; }
.dp-grid span.sun, .dp-grid button.sun { color: var(--a8); }
.dp-grid button { background: none; border: 0; border-radius: 8px; padding: 7px 0; font: inherit; font-size: .84rem; cursor: pointer; color: var(--fg); font-variant-numeric: tabular-nums; }
.dp-grid button:hover { background: var(--surface-2); }
.dp-grid button.out { opacity: .35; }
.dp-grid button.now { outline: 1.5px solid var(--accent); outline-offset: -1.5px; }
.dp-grid button.on { background: var(--accent); color: #fff; }
.dp-foot { display: flex; justify-content: space-between; margin-top: 8px; }

/* 일정 */
.tl-tools { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.tl-wrap { display: grid; grid-template-columns: 1fr 260px; gap: 12px; align-items: start; }
@media (max-width: 960px) { .tl-wrap { grid-template-columns: 1fr; } }
.tl { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); position: relative; }
.tl-grid { position: relative; }
.tl-head { position: sticky; top: 0; z-index: 3; height: 44px; background: var(--surface); border-bottom: 1px solid var(--line); }
.tl-head span { position: absolute; top: 6px; font-size: .72rem; color: var(--fg-3); font-variant-numeric: tabular-nums; white-space: nowrap; transform: translateX(4px); }
.tl-head span.m { top: 22px; font-weight: 700; color: var(--fg-2); }
.tl-lane { position: relative; border-bottom: 1px solid var(--line); }

<body>

<div class="lock" id="lock">
  <form class="lock-card" id="login-form">

</div>

      <button class="btn primary" id="new-btn" type="button">+ 새 업무 <kbd>N</kbd></button>
      <div class="menu">
        <button class="btn ghost" id="menu-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="메뉴">⋯</button>
        <div class="menu-pop" id="menu-pop" hidden>
          <button type="button" data-act="areas">분야 관리</button>
          <button type="button" data-act="name">내 이름 설정</button>
          <button type="button" data-act="theme">밝게 · 어둡게 바꾸기</button>
          <hr>
          <button type="button" data-act="mail" hidden>아침 메일 미리 받기</button>
          <button type="button" data-act="cal" hidden>캘린더 구독 주소 복사</button>

      <label class="field">분야<select class="input" name="area"></select></label>

    <h2>분야 관리</h2>

<script>
"use strict";
// ───────── 기본값 ─────────
const STATUS = [
  { key: "todo", name: "할 일" }, { key: "doing", name: "진행 중" },
  { key: "blocked", name: "막힘" }, { key: "done", name: "완료" },
];
const SNAME = Object.fromEntries(STATUS.map((s) => [s.key, s.name]));
const ICON = {
  todo: '<svg width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>',
  doing: '<svg width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6 1.5A4.5 4.5 0 0 1 6 10.5Z" fill="currentColor"/></svg>',
  blocked: '<svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 1.2L11 10.4H1Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M6 4.6v2.6M6 8.6v.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
  done: '<svg width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="currentColor"/><path d="M3.6 6.1l1.6 1.6 3.2-3.3" fill="none" stroke="var(--surface)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};
// 같은 화면을 두 곳에서 쓴다: /work/ = 스테이지로직 업무(Blob), /me/ = J&C · 개인 업무(노션 Action_DB)
const ME = location.pathname.startsWith("/me");
const CFG = ME
  ? { api: "/api/me/", kPass: "stagelogic-me-pass", kUi: "stagelogic-me-ui", brand: "J&C · 개인", sub: "Notion", title: "J&C · 개인 흐름",
      lock: "대표 개인용입니다. 노션 Action_DB와 이어져 있어, 여기서 고치면 노션에도 바로 반영됩니다.", file: "jnc-me-flow" }
  : { api: "/api/checklist/", kPass: "stagelogic-checklist-pass", kUi: "stagelogic-flow-ui", brand: "업무 흐름", sub: "StageLogic", title: "업무 흐름 | 스테이지로직",
      lock: "스테이지로직 내부용입니다. 비밀번호를 넣으면 이 기기에서는 다음부터 자동으로 열립니다.", file: "stagelogic-workflow" };
const K_PASS = CFG.kPass, K_USER = "stagelogic-user", K_UI = CFG.kUi, K_THEME = "stagelogic-theme";
const store = {
  get(k, d = "") { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { v === "" || v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const stTag = (k) => `<span class="st ${k}">${ICON[k]}${SNAME[k]}</span>`;

// ───────── 상태 ─────────
let pass = "", me = "";
let items = [], areas = [], tags = []; // tags: /me/ 에서만 (노션 '태그' 선택지)
let ui = { view: "flow", areas: [], tags: [], owners: [], statuses: [], hideDone: false, q: "", links: true, zoom: "week", sort: ["due", 1] };
try { Object.assign(ui, JSON.parse(store.get(K_UI, "{}"))); } catch {}
if (!Array.isArray(ui.tags)) ui.tags = [];
ui.q = "";
const saveUi = () => store.set(K_UI, JSON.stringify({ ...ui, q: "" }));
let openId = null;

// ───────── 날짜 ─────────
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDay = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };

}

// 노션 Areas of Responsibility → GTD System(프로젝트 · 다음 행동 …) → Action_DB 할 일 진행
let board = null, boardAt = 0, boardBusy = false;
const boardUrl = () => `${CFG.api}?scope=areas${ui.boardDone ? "&done=1" : ""}${ui.boardRefs ? "&refs=1" : ""}`;
async function loadBoard(force) {
  if (boardBusy || (!force && board && Date.now() - boardAt < 30000)) return;
  boardBusy = true;
  try { board = await api("GET", null, boardUrl()); boardAt = Date.now(); }
  catch (err) { if (err.status === 401) { lock("비밀번호가 바뀌었거나 맞지 않습니다."); return; } toast("영역을 불러오지 못했습니다."); }
  finally { boardBusy = false; }
  if (ui.view === "areas") render();
}
async function boardOp(body, optimistic) {
  if (optimistic) { optimistic(); render(); }
  setSync("busy");
  try { board = await api("POST", body, boardUrl()); boardAt = Date.now(); setSync("ok"); }
  catch { setSync("err"); toast("저장하지 못했습니다. 다시 불러옵니다."); await loadBoard(true); }
  if (ui.view === "areas") render();
}
function gtdRow(g) {
  const a = g.actions, pct = a.total ? Math.round(a.done / a.total * 100) : 0;
  const over = !g.done && g.due && g.due < TODAY();
  const mark = g.ref ? `<span class="g-ref" aria-hidden="true">▤</span>`
    : g.done ? `<button type="button" class="g-check is-done" data-gundo="${esc(g.id)}" aria-label="완료 풀기: ${esc(g.title)}" title="누르면 완료가 풀립니다">✓</button>`
    : `<button type="button" class="g-check" data-gdone="${esc(g.id)}" aria-label="완료로 표시: ${esc(g.title)}"></button>`;
  return `<li class="g-row${g.done ? " done" : ""}">
    ${mark}
    <div class="g-main"><a href="${esc(g.url)}" target="_blank" rel="noopener">${esc(g.title)}</a>
      <div class="g-meta">${g.priority ? `<span class="tag">${esc(g.priority)}</span>` : ""}${g.due ? `<span class="tag${over ? " over" : ""}">${shortDay(g.due)}${over ? " 지남" : ""}</span>` : ""}
      ${a.total ? `<span class="g-prog" title="이어진 할 일 ${a.done}/${a.total}"><i style="width:${pct}%"></i></span><span class="mono">${a.done}/${a.total}</span>` : ""}</div></div></li>`;
}
function areaCard(a, lists) {
  const groups = lists.map((l) => ({ l, xs: a.items.filter((g) => g.listId === l.id) })).filter((x) => x.xs.length);
  const other = a.items.filter((g) => !lists.some((l) => l.id === g.listId));
  if (other.length) groups.push({ l: { id: "", name: "분류 없음" }, xs: other });
  const projects = a.items.filter((g) => /project/i.test(g.list) && !g.done).length;
  const open = a.items.filter((g) => !g.done && !g.ref).length;
  return `<section class="a-card"${a.id ? ` data-area-card="${esc(a.id)}"` : ""}>
    <header><h3>${a.url ? `<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.name)}</a>` : esc(a.name)}</h3>
      <span class="msg">${projects ? `프로젝트 ${projects} · ` : ""}열린 항목 ${open}</span></header>
    ${groups.length ? groups.map(({ l, xs }) => `<p class="sec-t">${esc(l.name)} <b>${xs.length}</b></p><ul class="g-list">${xs.map(gtdRow).join("")}</ul>`).join("") : `<p class="msg">열린 항목이 없습니다.</p>`}
    ${a.id ? `<form class="g-add" data-garea="${esc(a.id)}"><input class="input" name="title" maxlength="120" placeholder="+ 이 영역에 추가" aria-label="새 항목 이름">
      <select class="input" name="list" aria-label="종류">${lists.map((l) => `<option value="${esc(l.id)}">${esc(l.name)}</option>`).join("")}</select>
      <input class="input" type="date" name="due" aria-label="마감일"><button class="btn" type="submit">추가</button></form>` : ""}
  </section>`;
}
function renderAreas(v) {
  if (!board) { v.innerHTML = `<div class="empty"><p>노션에서 영역을 불러오는 중…</p></div>`; loadBoard(); return; }
  loadBoard();
  const cards = board.areas.map((a) => areaCard(a, board.lists));
  if (board.noArea.length) cards.push(areaCard({ id: "", name: "영역 없음", url: "", items: board.noArea }, board.lists));
  v.innerHTML = `<div class="a-bar"><button type="button" class="chip" data-board="boardDone" aria-pressed="${!!ui.boardDone}">완료 포함</button>
    <button type="button" class="chip" data-board="boardRefs" aria-pressed="${!!ui.boardRefs}">자료(Reference) 보기</button>
    <span class="msg">노션 Areas of Responsibility 기준입니다. 동그라미를 누르면 완료, ✓를 누르면 완료가 풀립니다. 이름을 누르면 노션이 열립니다.</span></div><div class="a-grid">${cards.join("")}</div>`;
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-board]"); if (t) { ui[t.dataset.board] = !ui[t.dataset.board]; saveUi(); board = null; render(); return; }
  const u = e.target.closest("[data-gundo]");
  if (u && board) { const id = u.dataset.gundo; boardOp({ op: "gtd-done", id, done: false }, () => { [...board.areas.flatMap((a) => a.items), ...board.noArea].forEach((g) => { if (g.id === id) g.done = false; }); }); toast("완료를 풀었습니다."); return; }
  const b = e.target.closest("[data-gdone]"); if (!b || !board) return;
  const id = b.dataset.gdone;
  boardOp({ op: "gtd-done", id, done: true }, () => {
    if (ui.boardDone) { [...board.areas.flatMap((a) => a.items), ...board.noArea].forEach((g) => { if (g.id === id) g.done = true; }); return; }
    board.areas.forEach((a) => { a.items = a.items.filter((g) => g.id !== id); }); board.noArea = board.noArea.filter((g) => g.id !== id);
  });
  toast("완료로 표시했습니다.");
});
document.addEventListener("submit", (e) => {
  const f = e.target.closest(".g-add"); if (!f) return;
  e.preventDefault(); const title = f.title.value.trim(); if (!title) return;
  boardOp({ op: "gtd-add", area: f.dataset.garea, title, list: f.list.value, due: f.due.value });
  toast(`‘${title}’을(를) 추가했습니다.`);
});

// 새 업무
function openAdd(preset) {
  const f = $("#add-form");
  f.area.innerHTML = areas.map((a) => `<option value="${a.key}">${esc(a.name)}</option>`).join("");
  f.reset(); f.area.value = preset.area || (ui.areas[0] || areas[0].key); f.status.value = preset.status || "todo"; if (preset.due) f.due.value = preset.due; dpSync(f.due);
  f.owner.value = store.get(K_USER) || me || "대표"; $("#add-msg").textContent = "";
  $("#add-tag").hidden = !tags.length; $("#add-owner").hidden = Boolean(tags.length);
  f.tag.innerHTML = `<option value="">없음</option>` + tags.map((t) => `<option value="${esc(t.name)}">${esc(t.name)}</option>`).join("");
  $("#add-dlg").showModal(); f.title.focus();
}
// 상세의 '다음 할 일': 같은 분야 · 태그 · 담당으로 새 업무를 만들고 이 일을 선행으로 건다
document.addEventListener("submit", (e) => {
  const f = e.target.closest(".d-next"); if (!f) return; e.preventDefault();
  const inp = $("[data-next]", f), title = inp.value.trim(), it = items.find((i) => i.id === openId); if (!title || !it) return;
  const item = { title, area: it.area, owner: it.owner || "대표", status: "todo", due: "", detail: "", deps: [it.id] };
  if (tags.length) item.tag = it.tag || "";
  inp.value = "";
  send({ op: "add", item }, () => { items.push({ ...item, id: "tmp-" + Date.now(), order: 1e9, note: "", start: "", log: [], updatedAt: new Date().toISOString() }); });
  toast(`다음 할 일 ‘${title}’을(를) 추가했습니다.`);
});
$("#add-form").addEventListener("submit", (e) => {
  e.preventDefault(); const f = e.target, title = f.title.value.trim(); if (!title) return;
  const item = { title, area: f.area.value, owner: f.owner.value.trim() || "대표", status: f.status.value, due: f.due.value, detail: f.detail.value.trim() };
  if (tags.length) item.tag = f.tag.value;
  $("#add-dlg").close();
  send({ op: "add", item }, () => { items.push({ ...item, id: "tmp-" + Date.now(), order: 1e9, note: "", start: "", deps: [], log: [], updatedAt: new Date().toISOString() }); });
  toast(`‘${title}’을(를) 추가했습니다.`);
});

// 분야 관리
let draftAreas = [];
function renderAreaRows() {
  $("#area-rows").innerHTML = draftAreas.map((a, i) => `<div class="area-row" style="--c:${i < 8 ? `var(--a${i + 1})` : "var(--fg-3)"}"><i></i><input class="input" data-i="${i}" value="${esc(a.name)}" maxlength="30" aria-label="분야 이름"><button class="btn" type="button" data-up="${i}" aria-label="위로" ${i ? "" : "disabled"}>↑</button><button class="btn" type="button" data-down="${i}" aria-label="아래로" ${i < draftAreas.length - 1 ? "" : "disabled"}>↓</button><button class="btn danger" type="button" data-rm="${i}" ${items.some((x) => x.area === a.key) ? `disabled title="업무가 남아 있습니다"` : ""}>삭제</button></div>`).join("");
  $("#area-add").disabled = draftAreas.length >= 8;
}
$("#area-rows").addEventListener("input", (e) => { const i = e.target.dataset.i; if (i !== undefined) draftAreas[i].name = e.target.value; });
$("#area-rows").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const sw = (i, j) => { [draftAreas[i], draftAreas[j]] = [draftAreas[j], draftAreas[i]]; };
  if (b.dataset.up) sw(+b.dataset.up, +b.dataset.up - 1); else if (b.dataset.down) sw(+b.dataset.down, +b.dataset.down + 1); else if (b.dataset.rm) draftAreas.splice(+b.dataset.rm, 1);
  renderAreaRows();
});
$("#area-add").addEventListener("click", () => { draftAreas.push({ key: "", name: "새 분야" }); renderAreaRows(); $$("#area-rows input").at(-1).select(); });
$("#areas-save").addEventListener("click", () => {
  const list = draftAreas.map((a) => ({ key: a.key, name: a.name.trim() })).filter((a) => a.name);
  if (!list.length) { $("#areas-msg").textContent = "분야가 하나는 있어야 합니다."; return; }
  $("#areas-dlg").close(); send({ op: "areas", areas: list }, () => { areas = list.map((a) => ({ ...a, key: a.key || "tmp" + Math.random() })); });
});

function menu(act) {
  if (act === "areas") { draftAreas = areas.map((a) => ({ ...a })); $("#areas-msg").textContent = ""; renderAreaRows(); $("#areas-dlg").showModal(); }
  else if (act === "name") { const n = prompt("기록에 남길 이름을 입력하세요. (예: 대표, 김실장)", store.get(K_USER) || me || ""); if (n !== null) { store.set(K_USER, n.trim().slice(0, 20)); toast("이 기기에서 쓰는 이름을 바꿨습니다."); refresh(); } }
  else if (act === "theme") { const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; const next = dark ? "light" : "dark"; document.documentElement.dataset.theme = next; store.set(K_THEME, next); requestAnimationFrame(() => drawLinks()); }
  else if (act === "cal") {
    // 구글 캘린더: 다른 캘린더 + → URL로 추가 / 아이폰: 설정 → 캘린더 → 계정 → 구독 캘린더 추가
    api("GET", null, CFG.api + "?scope=calendar").then(async (d) => {
      try { await navigator.clipboard.writeText(d.url); toast("캘린더 구독 주소를 복사했습니다. 구글 캘린더 → 다른 캘린더 + → URL로 추가에 붙여 넣으세요."); }
      catch { prompt("캘린더 구독 주소 (복사해서 구글 캘린더 'URL로 추가'에 붙여 넣으세요)", d.url); }
    }).catch(() => toast("주소를 가져오지 못했습니다."));
  }
  else if (act === "mail") { api("POST", { op: "mail-preview", kind: kstHour() >= 18 ? "evening" : "morning" }).then((d) => toast(`메일을 보냈습니다: ${d.subject}`)).catch((err) => toast(err.status === 503 ? `메일 설정이 아직입니다 (${(err.missing || []).join(", ")})` : "메일을 보내지 못했습니다.")); }
  else if (act === "export") { const blob = new Blob([JSON.stringify({ items, areas, exportedAt: new Date().toISOString() }, null, 2)], { type: "application/json" }); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `${CFG.file}-${TODAY()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
  else if (act === "import") { if (items.length) { toast("업무가 하나도 없을 때만 불러올 수 있습니다. 먼저 백업을 내려받아 두세요."); return; } $("#import-file").click(); }
  else if (act === "logout") lock("");
}
$("#import-file").addEventListener("change", async (e) => {
  const file = e.target.files[0]; if (!file) return; e.target.value = "";
  try { const data = JSON.parse(await file.text()); send({ op: "import", items: Array.isArray(data) ? data : data.items, areas: data.areas }); }
  catch { toast("백업 파일 형식이 아닙니다."); }
});

let toastT = null;
function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }

// ───────── 잠금 · 시작 ─────────
function setupMsg(err) {
  const names = { storage: "Blob 저장소 연결", password: ME ? "ME_PASSWORD" : "CHECKLIST_PASSWORD", notion: "NOTION_TOKEN", notion_share: "노션 통합에 Action_DB 공유" };
  const m = (err.missing || []).map((k) => names[k] || k);
  return "서버 설정이 아직 끝나지 않았습니다." + (m.length ? " (빠진 것: " + m.join(", ") + ")" : "");
}
function lock(message) {
  pass = ""; store.set(K_PASS, ""); closeDrawer();
  $("#app").hidden = true; $("#lock").hidden = false; $("#login-msg").textContent = message; $("#pass").value = ""; $("#pass").focus();
}
async function unlock(p) {
  pass = p;
  try { const data = await api("GET"); store.set(K_PASS, p); $("#lock").hidden = true; $("#app").hidden = false; take(data); }
  catch (err) { lock(err.status === 401 ? "비밀번호가 맞지 않습니다." : err.status === 503 ? setupMsg(err) : "연결하지 못했습니다. 잠시 후 다시 시도해 주세요."); }
}
$("#login-form").addEventListener("submit", (e) => { e.preventDefault(); unlock($("#pass").value); });
window.addEventListener("focus", () => { if (pass && !openId) refresh(); });
setInterval(() => { if (pass && !openId && !document.hidden && !document.querySelector("dialog[open]")) refresh(); }, 60000);
document.title = CFG.title;
$(".brand").innerHTML = `<b>${esc(CFG.brand)}</b><span>${esc(CFG.sub)}</span>`;
$(".lock-card h1").textContent = CFG.brand; $(".lock-card p").textContent = CFG.lock;
if (ME) { $('#tabs [data-view="time"]').insertAdjacentHTML("afterend", '<button role="tab" data-view="cal" aria-selected="false">달력</button>'); $("#tabs").insertAdjacentHTML("beforeend", '<button role="tab" data-view="areas" aria-selected="false">영역</button>'); }
else if (ui.view === "areas" || ui.view === "cal") ui.view = "flow";
if (ME) $$('#menu-pop [data-act="mail"], #menu-pop [data-act="cal"]').forEach((b) => { b.hidden = false; });
if (ME) $$('#menu-pop [data-act="areas"], #menu-pop [data-act="import"], #menu-pop [data-act="name"]').forEach((b) => { b.hidden = true; });
const theme = store.get(K_THEME); if (theme) document.documentElement.dataset.theme = theme;
const saved = store.get(K_PASS); if (saved) unlock(saved); else lock("");
</script>
</body>
</html>
