<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>사업 점검표 | 스테이지로직</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
  <style>
  body { margin: 0; } [hidden] { display: none !important; }

/* 레이아웃: 위에 전체 진척, 그 아래 분야별 막대, 그 아래 분야별 항목 목록 */
:root {
  --bg: #f6f4ef; --surface: #ffffff; --line: #e6e1d6; --fg: #17181f; --muted: #6a6872;
  --accent: #a8822c; --accent-soft: #f2e9d2;
  --todo: #8b8a93; --doing: #2f6f9e; --doing-soft: #e3eef6; --done: #2f7d52; --done-soft: #e2f2e8;
  --blocked: #b5473a; --blocked-soft: #f7e4e1;
  --font: "IBM Plex Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121318; --surface: #1b1d25; --line: #2c2f3b; --fg: #ecebf0; --muted: #a09fab;
  --accent: #d6b25f; --accent-soft: #3a3220;
  --todo: #8f8e99; --doing: #7fb4dc; --doing-soft: #1d2f3d; --done: #6fc496; --done-soft: #1a3427;
  --blocked: #e48a7d; --blocked-soft: #3d2320; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121318; --surface: #1b1d25; --line: #2c2f3b; --fg: #ecebf0; --muted: #a09fab;
  --accent: #d6b25f; --accent-soft: #3a3220;
  --todo: #8f8e99; --doing: #7fb4dc; --doing-soft: #1d2f3d; --done: #6fc496; --done-soft: #1a3427;
  --blocked: #e48a7d; --blocked-soft: #3d2320; color-scheme: dark }

body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 960px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; }
h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: -0.02em; text-wrap: balance; }
.lead { color: var(--muted); margin: 0 0 24px; }

.summary { display: grid; grid-template-columns: 220px 1fr; gap: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; margin-bottom: 18px; }
@media (max-width: 640px) { .summary { grid-template-columns: 1fr; } }
.big { font-size: 2.6rem; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.big small { font-size: 1rem; color: var(--muted); font-weight: 600; margin-left: 4px; }
.counts { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.counts b { color: var(--fg); }
.areas { display: grid; gap: 8px; align-content: center; }
.area-row { display: grid; grid-template-columns: 120px 1fr 52px; gap: 10px; align-items: center; font-size: .88rem; }
.area-row button { all: unset; cursor: pointer; font-weight: 600; }
.area-row button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .d { background: var(--done); } .bar .g { background: var(--doing); }
.pct { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

.filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; }
.filters button { font: inherit; font-size: .85rem; font-weight: 600; padding: 6px 13px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.filters button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

section.group { margin-bottom: 22px; }
.group h2 { font-size: 1.05rem; margin: 0 0 8px; display: flex; gap: 8px; align-items: baseline; }
.group h2 span { font-size: .8rem; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
ul.items { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
li.item { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; padding: 13px 16px; border-top: 1px solid var(--line); align-items: start; }
li.item:first-child { border-top: 0; }
.item .t { font-weight: 600; min-width: 0; }
.item.s-done .t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.item .d { grid-column: 1; font-size: .86rem; color: var(--muted); min-width: 0; }
.item .note { grid-column: 1 / -1; font-size: .84rem; background: var(--accent-soft); border-radius: 8px; padding: 6px 10px; }
.meta { display: flex; gap: 6px; align-items: center; grid-row: 1 / span 2; grid-column: 2; }
.owner { font-size: .75rem; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 2px 8px; white-space: nowrap; }
select.status { font: inherit; font-size: .8rem; font-weight: 700; border-radius: 99px; padding: 4px 10px; border: 0; cursor: pointer; appearance: none; text-align: center; min-width: 66px; }
select.status:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.st-todo { background: var(--line); color: var(--todo); }
.st-doing { background: var(--doing-soft); color: var(--doing); }
.st-done { background: var(--done-soft); color: var(--done); }
.st-blocked { background: var(--blocked-soft); color: var(--blocked); }
select.status:disabled { cursor: default; }
@media (max-width: 560px) { li.item { grid-template-columns: 1fr; } .meta { grid-row: auto; grid-column: 1; } }

.adder { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 22px; }
.adder summary { cursor: pointer; font-weight: 700; }
.adder summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.add-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.add-form label { display: grid; gap: 4px; font-size: .82rem; font-weight: 600; color: var(--muted); min-width: 0; }
.add-form .wide { grid-column: 1 / -1; }
.add-form input, .add-form select, .add-form textarea { font: inherit; font-size: .92rem; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.add-form textarea { min-height: 60px; resize: vertical; }
.add-form input:focus, .add-form select:focus, .add-form textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
.add-form .row-end { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; }
.btn { font: inherit; font-weight: 700; font-size: .9rem; border: 0; border-radius: 99px; padding: 8px 18px; cursor: pointer; background: var(--fg); color: var(--bg); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.msg { font-size: .85rem; color: var(--muted); }
@media (max-width: 560px) { .add-form { grid-template-columns: 1fr; } }
.del { font: inherit; font-size: .78rem; color: var(--muted); background: none; border: 1px solid transparent; border-radius: 99px; padding: 3px 8px; cursor: pointer; }
.del:hover { border-color: var(--line); color: var(--blocked); }
.del.armed { background: var(--blocked-soft); color: var(--blocked); border-color: transparent; font-weight: 700; }
.del:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 28px; text-align: center; color: var(--muted); }
.legend { font-size: .82rem; color: var(--muted); margin-top: 26px; }
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width .3s ease; } }

.login { max-width: 420px; grid-template-columns: 1fr; }
.tools { display: flex; gap: 16px; margin-top: 18px; }
.link { font: inherit; font-size: .85rem; background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; cursor: pointer; }
.link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  </style>
</head>
<body>
<div class="wrap" id="login-wrap">
  <h1>스테이지로직 사업 점검표</h1>
  <p class="lead">비밀번호를 넣으면 열립니다. 이 기기에서는 다음부터 자동으로 열립니다.</p>
  <form class="add-form login" id="login-form">
    <label class="wide">비밀번호<input id="pass" type="password" autocomplete="current-password" required></label>
    <div class="row-end"><button class="btn" type="submit">열기</button><span class="msg" id="login-msg" role="status"></span></div>
  </form>
</div>

<div class="wrap" id="app" hidden>
  <h1>스테이지로직 사업 점검표</h1>
  <p class="lead">사업에 필요한 일을 분야별로 모아 두고, 상태를 바꾸면 진척률이 바로 반영됩니다.</p>

  <div class="summary" aria-live="polite">
    <div>
      <div class="big" id="pct">–<small>%</small></div>
      <div class="counts" id="counts">불러오는 중</div>
    </div>
    <div class="areas" id="areas"></div>
  </div>

  <div class="filters" role="group" aria-label="보기 선택" id="filters">
    <button type="button" data-f="all" aria-pressed="true">전체</button>
    <button type="button" data-f="open" aria-pressed="false">남은 일</button>
    <button type="button" data-f="대표" aria-pressed="false">대표 담당</button>
    <button type="button" data-f="Claude" aria-pressed="false">Claude 담당</button>
    <button type="button" data-f="blocked" aria-pressed="false">막힘</button>
  </div>

  <details class="adder" id="adder">
    <summary>업무 추가</summary>
    <form class="add-form" id="add-form">
      <label class="wide">업무 이름<input id="f-title" name="title" required maxlength="120" placeholder="예: 신년음악회 제안서 보내기"></label>
      <label>분야<select id="f-area" name="area"></select></label>
      <label>담당<select id="f-owner" name="owner"><option>대표</option><option>Claude</option><option>함께</option></select></label>
      <label class="wide">설명 (선택)<textarea id="f-detail" name="detail" maxlength="500"></textarea></label>
      <div class="row-end"><button class="btn" type="submit">추가</button><span class="msg" id="add-msg" role="status"></span></div>
    </form>
  </details>

  <div class="adder" id="importer" hidden>
    <b>처음 시작하기</b>
    <p class="msg">받으신 점검표 백업 파일(.json)을 고르면 항목을 한 번에 불러옵니다.</p>
    <input type="file" id="import-file" accept="application/json,.json">
    <span class="msg" id="import-msg" role="status"></span>
  </div>

  <div id="list"><div class="empty">점검 항목을 불러오는 중입니다.</div></div>

  <div class="tools"><button type="button" class="link" id="export">백업 파일 내려받기</button><button type="button" class="link" id="logout">이 기기에서 잠그기</button></div>
  <p class="legend">상태: 할 일 → 진행 중 → 완료, 다른 일 때문에 멈춘 항목은 막힘. 진척률은 완료 1, 진행 중 0.5로 계산합니다.</p>
</div>


<script>
const AREAS = [
  ["base", "사업 기반"], ["portfolio", "포트폴리오"], ["stage", "공연기획"],
  ["web", "홈페이지 제작"], ["academy", "학원 솔루션 · 키트"], ["sales", "판매 · 마케팅"],
];
const STATUS = { todo: "할 일", doing: "진행 중", done: "완료", blocked: "막힘" };
const KEY = "stagelogic-checklist-pass";
let items = [], filter = "all", areaFilter = null, armed = null, armTimer = null, pass = "";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const score = (list) => list.length ? list.reduce((a, i) => a + (i.status === "done" ? 1 : i.status === "doing" ? 0.5 : 0), 0) / list.length : 0;
const store = { get() { try { return localStorage.getItem(KEY) || ""; } catch { return ""; } },
  set(v) { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch {} } };
$("f-area").innerHTML = AREAS.map(([k, n]) => `<option value="${k}">${n}</option>`).join("");

async function api(method, body) {
  const res = await fetch("/api/checklist", { method, headers: { "Content-Type": "application/json", "x-checklist-pass": pass }, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(data.error || "error"); e.status = res.status; e.missing = data.missing || []; throw e; }
  return data;
}
function apply(data) { items = data.items || []; render(); }

function render() {
  const total = items.length;
  const by = (s) => items.filter((i) => i.status === s).length;
  $("pct").innerHTML = (total ? Math.round(score(items) * 100) : 0) + "<small>%</small>";
  $("counts").innerHTML = total
    ? `<span>전체 <b>${total}</b></span><span>완료 <b>${by("done")}</b></span><span>진행 중 <b>${by("doing")}</b></span><span>막힘 <b>${by("blocked")}</b></span><span>할 일 <b>${by("todo")}</b></span>`
    : "아직 항목이 없습니다";
  $("importer").hidden = total > 0;
  $("areas").innerHTML = AREAS.map(([k, name]) => {
    const l = items.filter((i) => i.area === k);
    if (!l.length) return "";
    const d = l.filter((i) => i.status === "done").length / l.length * 100;
    const g = l.filter((i) => i.status === "doing").length / l.length * 100;
    return `<div class="area-row"><button type="button" data-area="${k}" aria-pressed="${areaFilter === k}">${name}</button>
      <div class="bar" role="img" aria-label="${name} 완료 ${Math.round(d)}%"><i class="d" style="width:${d}%"></i><i class="g" style="width:${g}%"></i></div>
      <span class="pct">${Math.round(score(l) * 100)}%</span></div>`;
  }).join("");
  const show = items.filter((i) =>
    (!areaFilter || i.area === areaFilter) &&
    (filter === "all" || (filter === "open" && i.status !== "done") || (filter === "blocked" && i.status === "blocked") || i.owner === filter));
  const list = $("list");
  if (!total) { list.innerHTML = `<div class="empty">아직 점검 항목이 없습니다. 위에서 백업 파일을 불러오거나 업무를 추가해 주세요.</div>`; return; }
  if (!show.length) { list.innerHTML = `<div class="empty">이 조건에 맞는 항목이 없습니다.</div>`; return; }
  list.innerHTML = AREAS.map(([k, name]) => {
    const l = show.filter((i) => i.area === k).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
    if (!l.length) return "";
    const all = items.filter((i) => i.area === k);
    return `<section class="group"><h2>${name}<span>${all.filter((i) => i.status === "done").length} / ${all.length}</span></h2><ul class="items">${
      l.map((i) => `<li class="item s-${i.status}">
        <div class="t">${esc(i.title)}</div>
        <div class="meta"><span class="owner">${esc(i.owner)}</span>
          <select class="status st-${i.status}" data-id="${esc(i.id)}" aria-label="${esc(i.title)} 상태">
            ${Object.entries(STATUS).map(([v, t]) => `<option value="${v}" ${v === i.status ? "selected" : ""}>${t}</option>`).join("")}
          </select><button type="button" class="del${armed === i.id ? " armed" : ""}" data-del="${esc(i.id)}" aria-label="${esc(i.title)} 삭제">${armed === i.id ? "삭제 확인" : "삭제"}</button></div>
        ${i.detail ? `<div class="d">${esc(i.detail)}</div>` : ""}
        ${i.note ? `<div class="note">${esc(i.note)}</div>` : ""}
      </li>`).join("")}</ul></section>`;
  }).join("");
}

function fail(err) {
  if (err.status === 401) { lock("비밀번호가 바뀌었거나 맞지 않습니다."); return; }
  $("counts").textContent = err.status === 503 ? setupMsg(err) : "저장하지 못했습니다. 잠시 후 다시 시도해 주세요.";
  refresh();
}
// 503일 때 무엇이 빠졌는지 알려 준다
function setupMsg(err) {
  const names = { storage: "Blob 저장소 연결", password: "CHECKLIST_PASSWORD" };
  const m = (err.missing || []).map((k) => names[k] || k);
  return "서버 설정이 아직 끝나지 않았습니다." + (m.length ? " (빠진 것: " + m.join(", ") + ")" : "");
}
async function refresh() { try { apply(await api("GET")); } catch (e) { if (e.status === 401) lock("비밀번호가 맞지 않습니다."); } }

$("filters").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-f]"); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll("#filters button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  render();
});
$("areas").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-area]"); if (!b) return;
  areaFilter = areaFilter === b.dataset.area ? null : b.dataset.area; render();
});
$("list").addEventListener("change", async (e) => {
  const s = e.target.closest("select.status"); if (!s) return;
  s.disabled = true;
  try { apply(await api("POST", { op: "status", id: s.dataset.id, status: s.value })); } catch (err) { fail(err); }
});
$("list").addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-del]"); if (!b) return;
  const id = b.dataset.del;
  if (armed !== id) {
    armed = id; clearTimeout(armTimer);
    armTimer = setTimeout(() => { armed = null; render(); }, 4000);
    render(); document.querySelector(`button[data-del="${CSS.escape(id)}"]`)?.focus(); return;
  }
  armed = null; clearTimeout(armTimer); b.disabled = true;
  try { apply(await api("POST", { op: "delete", id })); } catch (err) { fail(err); }
});
$("add-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target, msg = $("add-msg"), title = f.title.value.trim();
  if (!title) { f.title.focus(); return; }
  const btn = f.querySelector("button[type=submit]"); btn.disabled = true;
  try {
    apply(await api("POST", { op: "add", item: { area: f.area.value, owner: f.owner.value, title, detail: f.detail.value.trim() } }));
    f.title.value = ""; f.detail.value = ""; msg.textContent = `‘${title}’을(를) 추가했습니다.`;
  } catch (err) { msg.textContent = "추가하지 못했습니다."; if (err.status === 401) fail(err); }
  finally { btn.disabled = false; }
});
$("import-file").addEventListener("change", async (e) => {
  const file = e.target.files[0]; if (!file) return;
  const msg = $("import-msg");
  try {
    const data = JSON.parse(await file.text());
    const list = Array.isArray(data) ? data : data.items;
    apply(await api("POST", { op: "import", items: list }));
    msg.textContent = "";
  } catch (err) { msg.textContent = err.status ? "불러오지 못했습니다. 이미 항목이 있으면 불러올 수 없습니다." : "백업 파일 형식이 아닙니다."; }
});
$("export").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify({ items, exportedAt: new Date().toISOString() }, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `stagelogic-checklist-${new Date().toISOString().slice(0, 10)}.json`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$("logout").addEventListener("click", () => lock(""));

function lock(message) {
  pass = ""; store.set("");
  $("app").hidden = true; $("login-wrap").hidden = false; $("login-msg").textContent = message; $("pass").focus();
}
async function unlock(p) {
  pass = p;
  try { apply(await api("GET")); store.set(p); $("login-wrap").hidden = true; $("app").hidden = false; }
  catch (err) { lock(err.status === 401 ? "비밀번호가 맞지 않습니다." : err.status === 503 ? setupMsg(err) : "연결하지 못했습니다. 잠시 후 다시 시도해 주세요."); }
}
$("login-form").addEventListener("submit", (e) => { e.preventDefault(); unlock($("pass").value); });
window.addEventListener("focus", () => { if (pass) refresh(); });
const saved = store.get();
if (saved) unlock(saved); else lock("");
</script>
</body>
</html>
