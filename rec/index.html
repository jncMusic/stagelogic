<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>기록</title>
  <!-- 휴대폰 홈 화면에 '기록' 아이콘으로 두고 쓰는 빠른 기록 화면. 넣은 것은 노션 Action_DB의 수집함(분야 없음)으로 간다. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="기록">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f4f3ef">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <style>
:root { --bg: #f4f3ef; --surface: #fcfcfb; --line: #e3e1da; --fg: #0b0b0b; --fg-2: #52514e; --fg-3: #7b7a74; --ok: #1baf7a; --bad: #c43c3c;
  --font: -apple-system, "Apple SD Gothic Neo", "Pretendard Variable", "Malgun Gothic", sans-serif; }
@media (prefers-color-scheme: dark) { :root { --bg: #121211; --surface: #1a1a19; --line: #2e2d2a; --fg: #f0efec; --fg-2: #c3c2b7; --fg-3: #8f8e86; } }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); -webkit-text-size-adjust: 100%; }
main { max-width: 560px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 18px 40px; }
h1 { font-size: 1.5rem; margin: 6px 0 4px; letter-spacing: -.02em; }
.sub { color: var(--fg-3); font-size: .9rem; margin: 0 0 16px; }
textarea, input { width: 100%; font: inherit; font-size: 1.15rem; color: var(--fg); background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 14px 16px; outline: none; }
textarea { min-height: 120px; resize: none; line-height: 1.5; }
textarea:focus, input:focus { border-color: var(--fg); }
button { font: inherit; font-weight: 800; font-size: 1.1rem; width: 100%; margin-top: 12px; padding: 16px; border-radius: 14px; border: 0; background: var(--fg); color: var(--bg); }
button:disabled { opacity: .45; }
.msg { min-height: 1.4em; margin: 12px 2px 0; font-size: .95rem; color: var(--fg-2); }
.msg.ok { color: var(--ok); font-weight: 700; } .msg.bad { color: var(--bad); font-weight: 700; }
.recent { list-style: none; padding: 0; margin: 22px 0 0; border-top: 1px solid var(--line); }
.recent li { padding: 10px 2px; border-bottom: 1px solid var(--line); font-size: .95rem; color: var(--fg-2); display: flex; justify-content: space-between; gap: 10px; }
.recent time { color: var(--fg-3); font-size: .8rem; white-space: nowrap; }
.links { margin-top: 22px; font-size: .9rem; } .links a { color: var(--fg-2); }
[hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>기록</h1>
  <p class="sub">떠오른 일을 한 줄로. 정리는 저녁에 흐름표에서 합니다.</p>

  <form id="lock" hidden>
    <input id="pass" type="password" autocomplete="current-password" placeholder="흐름표(/me/) 비밀번호" aria-label="비밀번호">
    <button type="submit">열기</button>
    <p class="msg" id="lock-msg"></p>
  </form>

  <form id="rec" hidden>
    <textarea id="text" maxlength="120" placeholder="예: 김하준 어머니께 보강 일정 문자" aria-label="기록할 내용" enterkeyhint="send"></textarea>
    <button type="submit" id="send">넣기</button>
    <p class="msg" id="msg" role="status"></p>
    <ul class="recent" id="recent" aria-label="방금 넣은 것"></ul>
    <p class="links"><a href="/me/">흐름표 열기</a> · <a href="#" id="logout">이 기기에서 잠그기</a></p>
  </form>
</main>
<script>
"use strict";
// /me/ 와 같은 비밀번호 저장 칸을 쓴다 — 휴대폰에서 /me/ 를 한 번 열었다면 바로 쓸 수 있다.
const K_PASS = "stagelogic-me-pass", K_RECENT = "stagelogic-rec-recent";
const $ = (s) => document.querySelector(s);
const store = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
  set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} },
};
let pass = store.get(K_PASS);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const say = (el, text, cls) => { el.textContent = text; el.className = "msg" + (cls ? " " + cls : ""); };

async function call(body) {
  const res = await fetch("/api/me/", { method: "POST", headers: { "Content-Type": "application/json", "x-checklist-pass": pass }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(data.error || "error"); e.status = res.status; throw e; }
  return data;
}
function recent() {
  let list = []; try { list = JSON.parse(store.get(K_RECENT) || "[]"); } catch {}
  $("#recent").innerHTML = list.slice(0, 8).map((r) => `<li><span>${esc(r.t)}</span><time>${new Date(r.at).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" })}</time></li>`).join("");
  return list;
}
function show(locked, message) {
  $("#lock").hidden = !locked; $("#rec").hidden = locked;
  if (locked) { say($("#lock-msg"), message || ""); $("#pass").focus(); } else { recent(); $("#text").focus(); }
}

$("#lock").addEventListener("submit", async (e) => {
  e.preventDefault(); pass = $("#pass").value.trim(); if (!pass) return;
  try { await fetch("/api/me/?scope=today", { headers: { "x-checklist-pass": pass } }).then((r) => { if (r.status === 401) throw Object.assign(new Error(), { status: 401 }); if (!r.ok) throw new Error(); });
    store.set(K_PASS, pass); show(false);
  } catch (err) { show(true, err.status === 401 ? "비밀번호가 맞지 않습니다." : "연결하지 못했습니다. 잠시 후 다시 해 주세요."); }
});

$("#rec").addEventListener("submit", async (e) => {
  e.preventDefault();
  const t = $("#text").value.replace(/\s+/g, " ").trim(); if (!t) { $("#text").focus(); return; }
  $("#send").disabled = true; say($("#msg"), "넣는 중…");
  try {
    await call({ op: "capture", text: t });
    $("#text").value = "";
    const list = recent(); list.unshift({ t, at: Date.now() }); store.set(K_RECENT, JSON.stringify(list.slice(0, 20))); recent();
    say($("#msg"), "수집함에 넣었습니다.", "ok");
  } catch (err) {
    if (err.status === 401) { store.set(K_PASS, ""); pass = ""; show(true, "비밀번호를 다시 넣어 주세요."); return; }
    say($("#msg"), "넣지 못했습니다. 내용은 그대로 있으니 다시 눌러 주세요.", "bad");
  } finally { $("#send").disabled = false; $("#text").focus(); }
});
// 키보드의 '보내기'(엔터)로도 넣기
$("#text").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#rec").requestSubmit(); } });
$("#logout").addEventListener("click", (e) => { e.preventDefault(); store.set(K_PASS, ""); pass = ""; show(true); });

show(!pass);
</script>
</body>
</html>
